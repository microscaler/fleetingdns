apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Reference the main Flux installation with cluster-specific patches
  - ../../../../../../flux/

patches:
  # Patch GitRepository for production environment
  - target:
      kind: GitRepository
      name: fleetingdns
    patch: |-
      - op: replace
        path: /spec/ref/branch
        value: main
      - op: replace
        path: /spec/interval
        value: 5m0s
      - op: replace
        path: /spec/secretRef/name
        value: flux-system-us-west-1-prod

  # Patch workload Kustomization for US West 1 production
  - target:
      kind: Kustomization
      name: fleetingdns-workload
    patch: |-
      - op: replace
        path: /spec/path
        value: "./k8s-tilt/clusters/workload/us-west-1/prod/auto-pilot"
      - op: replace
        path: /spec/postBuild/substitute/cluster_name
        value: "fleetingdns-us-west-1-prod"
      - op: replace
        path: /spec/postBuild/substitute/region
        value: "us-west-1"
      - op: replace
        path: /spec/postBuild/substitute/environment
        value: "production"

  # Patch infrastructure Kustomization for US West 1 production
  - target:
      kind: Kustomization
      name: fleetingdns-infra
    patch: |-
      - op: replace
        path: /spec/postBuild/substitute/cluster_name
        value: "fleetingdns-us-west-1-prod"
      - op: replace
        path: /spec/postBuild/substitute/region
        value: "us-west-1"
      - op: replace
        path: /spec/postBuild/substitute/project_id
        value: "fleetingdns-prod-us-west-1" 