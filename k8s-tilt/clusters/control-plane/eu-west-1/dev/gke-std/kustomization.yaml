apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reference the control-plane base only (Crossplane + External Secrets)
resources:
  # Flux kustomization for GitOps deployment (reference existing flux directory)
  - ../../../../../flux/
  # Essential control-plane components only (Crossplane + External Secrets)
  - ../../../../../base/control-plane/

# No service patches needed for control-plane components
# Crossplane and External Secrets don't expose external services 