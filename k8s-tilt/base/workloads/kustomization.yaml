apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Flux Kustomization for dependency management
  - flux-kustomization.yaml
  
  # Centralized namespace management (must come first for dependencies)
  - namespaces/
  
  # FleetingDNS services only
  - ../../fleetingdns/dnsd/
  - ../../fleetingdns/edgehub/
  - ../../fleetingdns/api/ 