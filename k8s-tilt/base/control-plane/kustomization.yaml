apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Flux Kustomization for dependency management
  - flux-kustomization.yaml
  
  # Centralized namespace management (must come first for dependencies)
  - namespaces/
  
  # Essential control-plane components (needed by both cluster types)
  - ../../components/crossplane/
  - ../../components/external-secrets/
  - ../../components/external-dns/ 