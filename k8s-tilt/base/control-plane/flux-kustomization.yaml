apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fleetingdns-control-plane-components
  namespace: flux-system
spec:
  interval: 5m0s
  path: "./k8s-tilt/base/control-plane"
  prune: true
  sourceRef:
    kind: GitRepository
    name: fleetingdns
  timeout: 15m0s
  wait: true
  dependsOn:
    - name: fleetingdns-namespaces
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2beta1
      kind: HelmRelease
      name: crossplane
      namespace: crossplane-system
    - apiVersion: helm.toolkit.fluxcd.io/v2beta1
      kind: HelmRelease
      name: external-secrets
      namespace: external-secrets-system
    - apiVersion: helm.toolkit.fluxcd.io/v2beta1
      kind: HelmRelease
      name: external-dns
      namespace: external-dns 