apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fleetingdns-namespaces
  namespace: flux-system
spec:
  interval: 5m0s
  path: "./k8s-tilt/base/control-plane/namespaces"
  prune: true
  sourceRef:
    kind: GitRepository
    name: fleetingdns
  timeout: 10m0s
  wait: true
  healthChecks:
    - apiVersion: v1
      kind: Namespace
      name: crossplane-system
    - apiVersion: v1
      kind: Namespace
      name: external-secrets-system
    - apiVersion: v1
      kind: Namespace
      name: external-dns 