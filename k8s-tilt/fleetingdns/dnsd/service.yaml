apiVersion: v1
kind: Service
metadata:
  name: dnsd
  namespace: fleetingdns
  labels:
    app: dnsd
    component: core
spec:
  type: ClusterIP
  ports:
    - port: 53
      targetPort: 53
      protocol: UDP
      name: dns-udp
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: metrics
  selector:
    app: dnsd 