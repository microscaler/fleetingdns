apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fleetingdns
  labels:
    app: api
    component: core
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: metrics
  selector:
    app: api 