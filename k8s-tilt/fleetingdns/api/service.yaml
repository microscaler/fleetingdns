apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fleetingdns
  labels:
    app: api
    component: core
spec:
  type: ClusterIP
  ports:
    # 8880: 8080 is chronically contested on shared dev hosts.
    # Single port: the API serves app routes, /health and /metrics all
    # on 8880 — there is no separate metrics listener in api-bin.
    - port: 8880
      targetPort: 8880
      protocol: TCP
      name: http
  selector:
    app: api 