apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fleetingdns
  labels:
    app: api
    component: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        component: core
    spec:
      containers:
        - name: api
          image: fleetingdns/api:dev
          ports:
            # 8880: 8080 is chronically contested on shared dev hosts.
            # Single port: /health and /metrics are served on 8880 too.
            - containerPort: 8880
              protocol: TCP
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql://fdns:fdns@postgres:5432/fdns"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: RUST_LOG
              value: "info"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "api"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8880
            initialDelaySeconds: 30
            periodSeconds: 10
          # NOTE: /ready sits behind the auth middleware (returns 401 without
          # an Authorization header), so probing it never succeeds. Use
          # /health until the app exempts /ready from auth.
          readinessProbe:
            httpGet:
              path: /health
              port: 8880
            initialDelaySeconds: 5
            periodSeconds: 5 