apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgehub
  namespace: fleetingdns
  labels:
    app: edgehub
    component: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edgehub
  template:
    metadata:
      labels:
        app: edgehub
        component: core
    spec:
      containers:
        - name: edgehub
          image: fleetingdns/edgehub:dev
          ports:
            - containerPort: 2222
              protocol: TCP
              name: ssh
            - containerPort: 8443
              protocol: TCP
              name: https
          # --ssh-addr defaults to 0.0.0.0:2222 and --https-addr to
          # 0.0.0.0:8443 (non-privileged; container runs as non-root user
          # `app`). Only redis needs overriding here.
          args:
            - "--redis"
            - "redis://redis:6379"
          env:
            - name: RUST_LOG
              value: "info"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "edgehub"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          # edgehub binds 2222 (SSH reverse-tunnel) and 443 (HTTPS router);
          # probe the SSH port which the CLI connects out to.
          livenessProbe:
            tcpSocket:
              port: 2222
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 2222
            initialDelaySeconds: 5
            periodSeconds: 5 