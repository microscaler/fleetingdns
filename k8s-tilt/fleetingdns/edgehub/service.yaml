apiVersion: v1
kind: Service
metadata:
  name: edgehub
  namespace: fleetingdns
  labels:
    app: edgehub
    component: core
spec:
  type: ClusterIP
  ports:
    - port: 2222
      targetPort: 2222
      protocol: TCP
      name: ssh
    - port: 443
      targetPort: 8443
      protocol: TCP
      name: https
  selector:
    app: edgehub 