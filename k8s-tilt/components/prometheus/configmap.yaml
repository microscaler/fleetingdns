apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fleetingdns
  labels:
    app: prometheus
    component: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      # - "first_rules.yml"
      # - "second_rules.yml"

    scrape_configs:
      # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Scrape OTEL Collector metrics
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector:8888']
        scrape_interval: 10s
        metrics_path: /metrics

      # Scrape OTEL Collector exported metrics
      - job_name: 'otel-collector-exported'
        static_configs:
          - targets: ['otel-collector:9464']

      # Scrape FleetingDNS services
      - job_name: 'dnsd'
        static_configs:
          - targets: ['dnsd:8080']
        scrape_interval: 10s

      - job_name: 'edgehub'
        static_configs:
          - targets: ['edgehub:8080']
        scrape_interval: 10s

      - job_name: 'api'
        static_configs:
          - targets: ['api:8081']
        scrape_interval: 10s 