apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fleetingdns
spec:
  interval: 10m0s
  timeout: 5m0s
  chart:
    spec:
      chart: prometheus
      version: "25.30.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: prometheus
      interval: 5m0s
  values:
    # Server configuration
    server:
      image:
        tag: "v2.52.0"
      
      service:
        type: ClusterIP
        port: 9090
      
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "1Gi"
          cpu: "500m"
      
      persistentVolume:
        enabled: false  # Using emptyDir for development
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      
      # Prometheus configuration
      configMapOverrideName: ""
      
    # Scrape configurations
    serverFiles:
      prometheus.yml:
        global:
          scrape_interval: 15s
          evaluation_interval: 15s
        
        scrape_configs:
          - job_name: 'prometheus'
            static_configs:
              - targets: ['localhost:9090']
          
          - job_name: 'fleetingdns-dnsd'
            static_configs:
              - targets: ['dnsd:8080']
            metrics_path: '/metrics'
          
          - job_name: 'fleetingdns-edgehub'
            static_configs:
              - targets: ['edgehub:8080']
            metrics_path: '/metrics'
          
          - job_name: 'fleetingdns-api'
            static_configs:
              - targets: ['api:8080']
            metrics_path: '/metrics'
          
          - job_name: 'otel-collector'
            static_configs:
              - targets: ['otel-collector:9464']
            metrics_path: '/metrics'
    
    # Disable components we don't need
    alertmanager:
      enabled: false
    
    nodeExporter:
      enabled: false
    
    pushgateway:
      enabled: false
    
    kube-state-metrics:
      enabled: false
    
    prometheus-node-exporter:
      enabled: false 