apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: fleetingdns
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fleetingdns
spec:
  interval: 10m0s
  timeout: 5m0s
  chart:
    spec:
      chart: loki
      version: "6.30.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 5m0s
  values:
    # Deployment mode
    deploymentMode: SingleBinary
    
    # Loki configuration
    loki:
      image:
        tag: "3.5.1"
      
      auth_enabled: false
      
      server:
        http_listen_port: 3100
        grpc_listen_port: 9096
      
      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
      
      query_range:
        results_cache:
          cache:
            embedded_cache:
              enabled: true
              max_size_mb: 100
      
      schema_config:
        configs:
          - from: 2020-10-24
            store: boltdb-shipper
            object_store: filesystem
            schema: v11
            index:
              prefix: index_
              period: 24h
      
      limits_config:
        enforce_metric_name: false
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        max_cache_freshness_per_query: 10m
        split_queries_by_interval: 15m
        max_query_parallelism: 32
        max_streams_per_user: 10000
        max_line_size: 256KB
        max_entries_limit_per_query: 5000
      
      compactor:
        working_directory: /loki/compactor
        shared_store: filesystem
        compaction_interval: 10m
        retention_enabled: true
        retention_delete_delay: 2h
        retention_delete_worker_count: 150
      
      table_manager:
        retention_deletes_enabled: true
        retention_period: 168h  # 7 days retention
      
      analytics:
        reporting_enabled: false
    
    # Single binary configuration
    singleBinary:
      replicas: 1
      
      service:
        type: ClusterIP
        port: 3100
      
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      
      persistence:
        enabled: false  # Using emptyDir for development
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
    
    # Disable components we don't need for single binary
    read:
      replicas: 0
    
    write:
      replicas: 0
    
    backend:
      replicas: 0
    
    # Test configuration
    test:
      enabled: false 