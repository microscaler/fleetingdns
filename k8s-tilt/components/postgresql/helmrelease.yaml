apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
  namespace: postgresql
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: infrastructure
    app.kubernetes.io/part-of: fleetingdns
spec:
  interval: 10m0s
  timeout: 5m0s
  chart:
    spec:
      chart: postgresql
      version: "16.5.1"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: postgresql
      interval: 5m0s
  values:
    # Image configuration
    image:
      tag: "16-alpine"
    
    # Authentication
    auth:
      enablePostgresUser: true
      postgresPassword: "postgres"  # PATCH: Override with secure password per environment
      username: "fleetingdns"
      password: "fleetingdns"  # PATCH: Override with secure password per environment
      database: "fleetingdns"
    
    # Architecture
    architecture: standalone
    
    # Primary configuration
    primary:
      service:
        type: ClusterIP
        ports:
          postgresql: 5432
      
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      
      persistence:
        enabled: false  # Using emptyDir for development
      
      securityContext:
        enabled: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
      
      containerSecurityContext:
        enabled: true
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
      
      # PostgreSQL configuration
      extendedConfiguration: |-
        # Performance settings for development
        shared_buffers = 64MB
        effective_cache_size = 256MB
        work_mem = 4MB
        maintenance_work_mem = 64MB
        # Connection settings
        max_connections = 100
        # Logging
        log_statement = 'all'
        log_duration = on
        log_min_duration_statement = 100ms
      
      # Health checks
      livenessProbe:
        enabled: true
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
        successThreshold: 1
      
      readinessProbe:
        enabled: true
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
        successThreshold: 1
    
    # Disable read replicas for development
    readReplicas:
      replicaCount: 0
    
    # Metrics configuration
    metrics:
      enabled: false  # Disable for simplicity
    
    # Common labels
    commonLabels:
      app: postgres
      component: infrastructure 