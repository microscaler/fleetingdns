apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: fleetingdns
  labels:
    app: mimir
    component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
        component: observability
    spec:
      containers:
        - name: mimir
          image: grafana/mimir:2.10.2
          ports:
            - containerPort: 9009
              name: http
            - containerPort: 9095
              name: grpc
          args:
            - "-config.file=/etc/mimir/mimir.yaml"
          volumeMounts:
            - name: mimir-config
              mountPath: /etc/mimir/
            - name: mimir-storage
              mountPath: /data/
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /ready
              port: 9009
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 9009
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: mimir-config
          configMap:
            name: mimir-config
        - name: mimir-storage
          emptyDir: {} 