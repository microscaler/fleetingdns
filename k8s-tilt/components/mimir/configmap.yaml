apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: fleetingdns
  labels:
    app: mimir
    component: observability
data:
  mimir.yaml: |
    target: all
    
    server:
      http_listen_port: 9009
      grpc_listen_port: 9095
      log_level: info

    common:
      storage:
        backend: filesystem
        filesystem:
          dir: /data

    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/blocks

    compactor:
      data_dir: /data/compactor

    distributor:
      pool:
        health_check_ingesters: true

    ingester:
      ring:
        final_sleep: 0s
        num_tokens: 512
        tokens_file_path: /data/tokens
        kvstore:
          store: inmemory

    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/ruler

    store_gateway:
      sharding_ring:
        kvstore:
          store: inmemory

    limits:
      max_global_series_per_user: 1500000
      max_global_series_per_metric: 20000 