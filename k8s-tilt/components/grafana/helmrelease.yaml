apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fleetingdns
spec:
  interval: 10m0s
  timeout: 5m0s
  chart:
    spec:
      chart: grafana
      version: "8.7.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: grafana
      interval: 5m0s
  values:
    # Image configuration
    image:
      tag: "11.4.0"
    
    # Service configuration
    service:
      type: ClusterIP
      port: 3000
    
    # Admin user configuration
    adminUser: admin
    adminPassword: admin  # PATCH: Override with secure password per environment
    
    # Persistence
    persistence:
      enabled: false  # Using emptyDir for development
    
    # Resources
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    
    # Datasources configuration
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            access: proxy
            url: http://prometheus:9090
            uid: prometheus
            isDefault: true
            editable: true
            jsonData:
              httpMethod: POST
              queryTimeout: 60s
              timeInterval: 5s
          
          - name: Loki
            type: loki
            access: proxy
            url: http://loki:3100
            uid: loki
            editable: true
            jsonData:
              maxLines: 1000
              timeout: 60s
    
    # Dashboard providers
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'default'
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards
    
    # Security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
    
    # Pod security context
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472 