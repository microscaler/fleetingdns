apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: fleetingdns
  labels:
    app: grafana
    component: observability
data:
  grafana.ini: |
    [server]
    http_port = 3000
    domain = localhost

    [security]
    admin_user = admin
    admin_password = admin

    [dashboards]
    default_home_dashboard_path = /var/lib/grafana/dashboards/fleetingdns-unified.json

    [users]
    allow_sign_up = false
    auto_assign_org = true
    auto_assign_org_role = Editor

    [auth.anonymous]
    enabled = false

    [analytics]
    reporting_enabled = false
    check_for_updates = false

    [log]
    mode = console
    level = info

    [panels]
    enable_alpha = true

    [feature_toggles]
    enable = publicDashboards

    [unified_alerting]
    enabled = true

    [alerting]
    enabled = false

    [explore]
    enabled = true

    [query]
    timeout = 60s

    [dataproxy]
    timeout = 60
    dial_timeout = 30
    keep_alive_seconds = 30

  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        uid: prometheus
        isDefault: true
        editable: true
        jsonData:
          httpMethod: POST
          queryTimeout: 60s
          timeInterval: 5s
        secureJsonData: {}

      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        uid: loki
        editable: true
        jsonData:
          maxLines: 1000

      - name: Mimir
        type: prometheus
        access: proxy
        url: http://mimir:9009/prometheus
        uid: mimir
        editable: true

  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards 