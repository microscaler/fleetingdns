apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: fleetingdns
  labels:
    app: otel-collector
    component: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
        send_batch_max_size: 2048

      memory_limiter:
        limit_mib: 512
        check_interval: 1s

      resource:
        attributes:
          - key: service.name
            value: fleetingdns
            action: upsert
          - key: deployment.environment
            value: development
            action: upsert

    exporters:
      prometheus:
        endpoint: "0.0.0.0:9464"
        namespace: fleetingdns
        const_labels:
          service: fleetingdns
        enable_open_metrics: true
        resource_to_telemetry_conversion:
          enabled: true

      loki:
        endpoint: http://loki:3100/loki/api/v1/push

      logging:
        verbosity: detailed

    service:
      telemetry:
        logs:
          level: "info"
        metrics:
          address: 0.0.0.0:8888

      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [logging]

        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheus, logging]

        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [loki, logging]

      extensions: [] 