apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: fleetingdns
  labels:
    app: otel-collector
    component: observability
spec:
  type: ClusterIP
  ports:
    - port: 4317
      targetPort: 4317
      protocol: TCP
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      protocol: TCP
      name: otlp-http
    - port: 8888
      targetPort: 8888
      protocol: TCP
      name: metrics
    - port: 9464
      targetPort: 9464
      protocol: TCP
      name: prometheus
  selector:
    app: otel-collector 