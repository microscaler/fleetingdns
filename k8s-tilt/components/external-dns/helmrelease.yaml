apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 5m
  chart:
    spec:
      chart: external-dns
      version: "1.15.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns
      interval: 5m
  values:
    # Provider configuration (placeholder - will be patched per environment)
    provider: google
    
    # Google Cloud DNS configuration
    google:
      project: "placeholder-project-id"
      serviceAccountSecret: "external-dns-sa"
    
    # Domain filters
    domainFilters:
      - "fleetingdns.com"
    
    # Resource limits
    resources:
      limits:
        cpu: 50m
        memory: 50Mi
      requests:
        cpu: 10m
        memory: 50Mi
    
    # Log level
    logLevel: info
    
    # Sync policy
    policy: sync
    
    # Registry
    registry: txt
    txtOwnerId: "external-dns" 