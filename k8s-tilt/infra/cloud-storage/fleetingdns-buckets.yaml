# Primary Data Storage Bucket
apiVersion: storage.gcp.upbound.io/v1beta1
kind: Bucket
metadata:
  name: fleetingdns-data-primary
  labels:
    app.kubernetes.io/name: fleetingdns-data-primary
    app.kubernetes.io/component: cloud-storage
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    name: fleetingdns-data-primary-eu
    project: fleetingdns-infra
    location: EUROPE-WEST1
    storageClass: STANDARD
    uniformBucketLevelAccess: true
    publicAccessPrevention: enforced
    versioning:
    - enabled: true
    lifecycleRule:
    - action:
      - type: SetStorageClass
        storageClass: NEARLINE
      condition:
      - age: 30
    - action:
      - type: SetStorageClass
        storageClass: COLDLINE
      condition:
      - age: 90
    - action:
      - type: SetStorageClass
        storageClass: ARCHIVE
      condition:
      - age: 365
    - action:
      - type: Delete
      condition:
      - age: 2555  # 7 years
    labels:
      environment: production
      purpose: primary-data
      managed-by: crossplane
  providerConfigRef:
    name: default
---
