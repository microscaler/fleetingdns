# Analytics Data Bucket
apiVersion: storage.gcp.upbound.io/v1beta1
kind: Bucket
metadata:
  name: fleetingdns-analytics-data
  labels:
    app.kubernetes.io/name: fleetingdns-analytics-data
    app.kubernetes.io/component: cloud-storage
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    name: fleetingdns-analytics-data-eu
    project: fleetingdns-analytics
    location: EUROPE-WEST1
    storageClass: STANDARD
    uniformBucketLevelAccess: true
    publicAccessPrevention: enforced
    versioning:
    - enabled: false  # Not needed for analytics data
    lifecycleRule:
    - action:
      - type: SetStorageClass
        storageClass: NEARLINE
      condition:
      - age: 7
    - action:
      - type: SetStorageClass
        storageClass: COLDLINE
      condition:
      - age: 30
    - action:
      - type: Delete
      condition:
      - age: 365  # 1 year retention for analytics
    labels:
      environment: production
      purpose: analytics
      managed-by: crossplane
  providerConfigRef:
    name: analytics
---
# Logs Storage Bucket
apiVersion: storage.gcp.upbound.io/v1beta1
kind: Bucket
metadata:
  name: fleetingdns-logs
  labels:
    app.kubernetes.io/name: fleetingdns-logs
    app.kubernetes.io/component: cloud-storage
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    name: fleetingdns-logs-eu
    project: fleetingdns-infra
    location: EUROPE-WEST1
    storageClass: STANDARD
    uniformBucketLevelAccess: true
    publicAccessPrevention: enforced
    versioning:
    - enabled: false
    lifecycleRule:
    - action:
      - type: SetStorageClass
        storageClass: NEARLINE
      condition:
      - age: 1
    - action:
      - type: SetStorageClass
        storageClass: COLDLINE
      condition:
      - age: 7
    - action:
      - type: Delete
      condition:
      - age: 90  # 90 days for operational logs
    labels:
      environment: production
      purpose: logs
      managed-by: crossplane
  providerConfigRef:
    name: default
