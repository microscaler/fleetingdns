apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: fleetingdns-infrastructure
  annotations:
    config.kubernetes.io/local-config: "true"

resources:
  # Phase 1: Foundation and Organization
  - base/
  - org/folders/
  - org/projects/
  
  # Phase 2: Core Infrastructure
  - iam/
  - iam/oauth-clients/
  - networking/vpcs/
  - networking/global-ips/
  - networking/ssl-certificates/
  - networking/peering/
  - networking/firewall/
  
  # Phase 3: Security Layer
  - security/cloud-armor/
  - security/iap/
  - security/security-center/
  - security/binary-authorization/
  - security/network-security/
  
  # Phase 4: Compute and Storage
  - k8s/gke/
  - k8s/autopilot/
  - databases/
  - cloud-storage/
  - artifact-registry/
  - secret-manager/
  
  # Phase 5: Networking Services
  - networking/load-balancers/
  - networking/cdn/
  - cloud-dns/
  
  # Phase 6: Observability and Analytics
  - observability/bigquery/
  - observability/logging/
  - observability/monitoring/
  - observability/tracing/
  - analytics/
  
commonLabels:
  app.kubernetes.io/name: fleetingdns-infrastructure
  app.kubernetes.io/component: infrastructure
  app.kubernetes.io/part-of: fleetingdns
  app.kubernetes.io/managed-by: crossplane

commonAnnotations:
  fleetingdns.com/infrastructure-version: "v1.0.0"
  fleetingdns.com/deployment-method: "crossplane"
  fleetingdns.com/gitops-managed: "true"

patches:
# Add common annotations to all resources
- target:
    group: "*"
    version: "*"
    kind: "*"
  patch: |-
    - op: add
      path: /metadata/annotations/crossplane.io~1managed-by
      value: fleetingdns-platform
    - op: add
      path: /metadata/annotations/fleetingdns.io~1deployment-order
      value: infrastructure

# Patch provider configurations to use correct credentials
- target:
    group: gcp.upbound.io
    version: v1beta1
    kind: ProviderConfig
  patch: |-
    - op: add
      path: /metadata/annotations/crossplane.io~1external-name
      value: fleetingdns-provider-config 