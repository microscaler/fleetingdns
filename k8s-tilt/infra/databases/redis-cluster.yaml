# Redis Cluster Configuration for FleetingDNS
# This replaces single-instance Redis with Redis Cluster for scalability

# Primary Redis Cluster (EU Region)
---
apiVersion: redis.gcp.upbound.io/v1beta1
kind: Instance
metadata:
  name: fleetingdns-redis-cluster-eu-master-1
  labels:
    app.kubernetes.io/name: fleetingdns-redis-cluster
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fleetingdns
    redis.fleetingdns.io/cluster: primary
    redis.fleetingdns.io/role: master
    redis.fleetingdns.io/node: "1"
spec:
  forProvider:
    name: fleetingdns-redis-cluster-eu-master-1
    project: fleetingdns-infra
    region: europe-west1
    tier: STANDARD_HA
    memorySizeGb: 8  # Increased for cluster performance
    redisVersion: REDIS_7_0
    displayName: "FleetingDNS EU Cluster Master 1"
    authorizedNetwork: "projects/fleetingdns-infra/global/networks/fleetingdns-infra-vpc"
    connectMode: PRIVATE_SERVICE_ACCESS
    authEnabled: true
    transitEncryptionMode: SERVER_AUTHENTICATION
    redisConfigs:
      # Cluster configuration
      cluster-enabled: "yes"
      cluster-config-file: "nodes-6379.conf"
      cluster-node-timeout: "5000"
      cluster-announce-hostname: "fleetingdns-redis-cluster-eu-master-1"
      cluster-announce-port: "6379"
      cluster-announce-bus-port: "16379"
      # Performance optimizations
      maxmemory-policy: "allkeys-lru"
      notify-keyspace-events: "Ex"
      timeout: "300"
      tcp-keepalive: "300"
      tcp-backlog: "511"
      # Persistence for cluster state
      save: "900 1 300 10 60 10000"
      appendonly: "yes"
      appendfsync: "everysec"
      # Memory optimization
      hash-max-ziplist-entries: "512"
      hash-max-ziplist-value: "64"
      list-max-ziplist-size: "-2"
      set-max-intset-entries: "512"
      zset-max-ziplist-entries: "128"
      zset-max-ziplist-value: "64"
    maintenancePolicy:
    - weeklyMaintenanceWindow:
      - day: SUNDAY
        startTime:
        - hours: 3
          minutes: 0
    labels:
      environment: production
      service: fleetingdns
      role: cluster-master
      node: "1"
      region: europe-west1
      managed-by: crossplane
  providerConfigRef:
    name: default
