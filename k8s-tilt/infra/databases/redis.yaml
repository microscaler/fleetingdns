# Primary Redis Instance for Production
apiVersion: redis.gcp.upbound.io/v1beta1
kind: Instance
metadata:
  name: fleetingdns-redis-primary
  labels:
    app.kubernetes.io/name: fleetingdns-redis-primary
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    name: fleetingdns-redis-primary
    project: fleetingdns-infra
    region: europe-west1
    tier: STANDARD_HA  # High availability
    memorySizeGb: 4
    redisVersion: REDIS_7_0
    displayName: "FleetingDNS Primary Redis"
    authorizedNetwork: "projects/fleetingdns-infra/global/networks/fleetingdns-infra-vpc"
    connectMode: PRIVATE_SERVICE_ACCESS
    authEnabled: true
    transitEncryptionMode: SERVER_AUTHENTICATION
    redisConfigs:
      maxmemory-policy: "allkeys-lru"
      notify-keyspace-events: "Ex"
      timeout: "300"
    maintenancePolicy:
    - weeklyMaintenanceWindow:
      - day: SUNDAY
        startTime:
        - hours: 3
          minutes: 0
    labels:
      environment: production
      service: fleetingdns
      role: primary
      managed-by: crossplane
  providerConfigRef:
    name: default
---
