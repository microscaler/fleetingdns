# Redis Sentinel Configuration for FleetingDNS
# Provides automatic failover and health monitoring for Redis Cluster

# Redis Sentinel instances for EU region
---
apiVersion: redis.gcp.upbound.io/v1beta1
kind: Instance
metadata:
  name: fleetingdns-redis-sentinel-eu-1
  labels:
    app.kubernetes.io/name: fleetingdns-redis-sentinel
    app.kubernetes.io/component: database-monitor
    app.kubernetes.io/part-of: fleetingdns
    redis.fleetingdns.io/cluster: primary
    redis.fleetingdns.io/role: sentinel
    redis.fleetingdns.io/node: "1"
spec:
  forProvider:
    name: fleetingdns-redis-sentinel-eu-1
    project: fleetingdns-infra
    region: europe-west1
    tier: BASIC
    memorySizeGb: 1  # Sentinel requires minimal memory
    redisVersion: REDIS_7_0
    displayName: "FleetingDNS EU Sentinel 1"
    authorizedNetwork: "projects/fleetingdns-infra/global/networks/fleetingdns-infra-vpc"
    connectMode: PRIVATE_SERVICE_ACCESS
    authEnabled: true
    transitEncryptionMode: SERVER_AUTHENTICATION
    redisConfigs:
      # Sentinel configuration
      sentinel: "yes"
      sentinel-announce-ip: "fleetingdns-redis-sentinel-eu-1"
      sentinel-announce-port: "26379"
      # Monitor the primary Redis cluster
      sentinel-monitor: "fleetingdns-cluster fleetingdns-redis-cluster-eu-master-1 6379 2"
      sentinel-down-after-milliseconds: "5000"
      sentinel-failover-timeout: "10000"
      sentinel-parallel-syncs: "1"
      # Health check configuration
      sentinel-auth-pass: "fleetingdns-cluster ${REDIS_AUTH_PASSWORD}"
      # Logging and monitoring
      loglevel: "notice"
      logfile: "/var/log/redis/sentinel.log"
      # Performance settings
      tcp-keepalive: "300"
      timeout: "30"
    maintenancePolicy:
      weeklyMaintenanceWindow:
        - day: SUNDAY
          startTime:
            hours: 3
            minutes: 0

