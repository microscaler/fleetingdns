# Health monitoring configuration
---
apiVersion: monitoring.gcp.upbound.io/v1beta1
kind: AlertPolicy
metadata:
  name: fleetingdns-redis-sentinel-health
  labels:
    app.kubernetes.io/name: fleetingdns-redis-sentinel
    app.kubernetes.io/component: monitoring
spec:
  forProvider:
    displayName: "FleetingDNS Redis Sentinel Health"
    project: fleetingdns-infra
    conditions:
      - displayName: "Redis Sentinel Down"
        conditionThreshold:
          filter: 'resource.type="redis_instance" AND resource.label.instance_id=~"fleetingdns-redis-sentinel-.*"'
          comparison: COMPARISON_EQUAL
          thresholdValue: 0
          duration: "300s"
          aggregations:
            - alignmentPeriod: "60s"
              perSeriesAligner: ALIGN_MEAN
              crossSeriesReducer: REDUCE_MEAN
              groupByFields: ["resource.label.instance_id"]
    alertStrategy:
      autoClose: "1800s"
    combiner: OR
    enabled: true
    notificationChannels: []

---
apiVersion: monitoring.gcp.upbound.io/v1beta1
kind: AlertPolicy
metadata:
  name: fleetingdns-redis-cluster-failover
  labels:
    app.kubernetes.io/name: fleetingdns-redis-sentinel
    app.kubernetes.io/component: monitoring
spec:
  forProvider:
    displayName: "FleetingDNS Redis Cluster Failover"
    project: fleetingdns-infra
    conditions:
      - displayName: "Redis Master Failover Detected"
        conditionThreshold:
          filter: 'resource.type="redis_instance" AND resource.label.instance_id=~"fleetingdns-redis-cluster-.*-master-.*"'
          comparison: COMPARISON_GREATER_THAN
          thresholdValue: 0
          duration: "60s"
          aggregations:
            - alignmentPeriod: "60s"
              perSeriesAligner: ALIGN_RATE
              crossSeriesReducer: REDUCE_SUM
              groupByFields: ["resource.label.instance_id"]
    alertStrategy:
      autoClose: "3600s"
    combiner: OR
    enabled: true
    notificationChannels: []

# Development environment simplified configuration
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetingdns-redis-sentinel-dev
  namespace: fleetingdns-dev
  labels:
    app.kubernetes.io/name: fleetingdns-redis-sentinel
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: fleetingdns
    environment: development
data:
  sentinel.conf: |
    # Redis Sentinel configuration for development
    port 26379
    sentinel monitor fleetingdns-cluster redis-cluster 6379 2
    sentinel down-after-milliseconds fleetingdns-cluster 5000
    sentinel failover-timeout fleetingdns-cluster 10000
    sentinel parallel-syncs fleetingdns-cluster 1
    sentinel auth-pass fleetingdns-cluster dev-password
    # Logging
    loglevel notice
    logfile ""
    # Performance
    tcp-keepalive 300
    timeout 30
    # Development optimizations
    sentinel-announce-ip 127.0.0.1
    sentinel-announce-port 26379 