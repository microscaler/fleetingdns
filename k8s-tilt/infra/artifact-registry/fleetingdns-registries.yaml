# Container Registry for FleetingDNS Images
apiVersion: artifactregistry.gcp.upbound.io/v1beta1
kind: Repository
metadata:
  name: fleetingdns-containers
  labels:
    app.kubernetes.io/name: fleetingdns-containers
    app.kubernetes.io/component: artifact-registry
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    repositoryId: fleetingdns-containers
    project: fleetingdns-infra
    location: europe-west1
    description: "Container images for FleetingDNS services"
    format: DOCKER
    labels:
      environment: multi
      content-type: containers
      managed-by: crossplane
  providerConfigRef:
    name: default
---
