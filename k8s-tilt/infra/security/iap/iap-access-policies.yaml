apiVersion: cloudresourcemanager.gcp.crossplane.io/v1alpha1
kind: ProjectIAMPolicy
metadata:
  name: fleetingdns-admin-iap-policy
  labels:
    app.kubernetes.io/name: fleetingdns-admin-iap-policy
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fleetingdns-infrastructure
    fleetingdns.com/access-level: admin
spec:
  forProvider:
    projectRef:
      name: fleetingdns-infra-project
    policy:
      bindings:
        - role: "roles/iap.httpsResourceAccessor"
          members:
            - "group:fleetingdns-admins@fleetingdns.com"
            - "user:admin@fleetingdns.com"
          condition:
            title: "Admin Portal Access"
            description: "Access to admin portal with MFA requirement"
            expression: |
              request.auth.access_levels.contains('accessPolicies/fleetingdns-access-policy/accessLevels/admin-level')
        - role: "roles/iap.webServiceViewer"
          members:
            - "group:fleetingdns-support@fleetingdns.com"
          condition:
            title: "Support Team Read Access"
            description: "Read-only access for support team"
            expression: |
              request.auth.access_levels.contains('accessPolicies/fleetingdns-access-policy/accessLevels/support-level')
  providerConfigRef:
    name: gcp-provider-config-infra
---
