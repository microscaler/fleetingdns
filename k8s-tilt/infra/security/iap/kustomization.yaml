apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: iap-config
  annotations:
    config.kubernetes.io/local-config: "true"

resources:
  - admin-iap-config.yaml
  - developer-iap-config.yaml
  - monitoring-iap-config.yaml
  - analytics-iap-config.yaml
  - iap-access-policies.yaml

commonLabels:
  app.kubernetes.io/name: fleetingdns-iap
  app.kubernetes.io/component: security
  app.kubernetes.io/part-of: fleetingdns-infrastructure 