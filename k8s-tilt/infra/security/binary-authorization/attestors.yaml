apiVersion: binaryauthorization.gcp.crossplane.io/v1alpha1
kind: Attestor
metadata:
  name: fleetingdns-vulnerability-scan-attestor
  labels:
    app.kubernetes.io/name: fleetingdns-vulnerability-scan-attestor
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fleetingdns-infrastructure
    fleetingdns.com/attestor-type: "vulnerability-scan"
spec:
  forProvider:
    name: "fleetingdns-vulnerability-scan"
    projectRef:
      name: fleetingdns-security-project
    description: "Attestor for vulnerability scanning of FleetingDNS containers"
    attestationAuthorityNote:
      noteReference: "projects/fleetingdns-security/notes/vulnerability-scan-note"
      publicKeys:
        - asciiArmoredPgpPublicKey: |
            -----BEGIN PGP PUBLIC KEY BLOCK-----
            # Replace with actual PGP public key for vulnerability scanning
            -----END PGP PUBLIC KEY BLOCK-----
          comment: "Vulnerability scan attestor public key"
      delegationServiceAccountEmail: "vulnerability-scanner@fleetingdns-security.iam.gserviceaccount.com"
  providerConfigRef:
    name: gcp-provider-config-security
---
