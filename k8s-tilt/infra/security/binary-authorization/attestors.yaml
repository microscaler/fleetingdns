# Container Analysis Notes for attestors
apiVersion: containeranalysis.gcp.crossplane.io/v1alpha1
kind: Note
metadata:
  name: fleetingdns-vulnerability-scan-note
  labels:
    app.kubernetes.io/name: fleetingdns-vulnerability-scan-note
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fleetingdns-infrastructure
spec:
  forProvider:
    name: "projects/fleetingdns-security/notes/vulnerability-scan-note"
    shortDescription: "Vulnerability scan attestation note"
    longDescription: "Container Analysis note for vulnerability scan attestations"
    attestationAuthority:
      hint:
        humanReadableName: "FleetingDNS Vulnerability Scanner"
  providerConfigRef:
    name: gcp-provider-config-security
