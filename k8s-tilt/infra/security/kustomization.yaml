apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: fleetingdns-security
  annotations:
    config.kubernetes.io/local-config: "true"

resources:
# Cloud Armor Security Policies
- cloud-armor/fleetingdns-security-policies.yaml

commonLabels:
  app.kubernetes.io/name: fleetingdns-security
  app.kubernetes.io/component: security
  app.kubernetes.io/part-of: fleetingdns
  app.kubernetes.io/managed-by: crossplane

patches:
# Add common annotations to all resources
- target:
    group: "*"
    version: "*"
    kind: "*"
  patch: |-
    - op: add
      path: /metadata/annotations/crossplane.io~1managed-by
      value: fleetingdns-platform
    - op: add
      path: /metadata/annotations/fleetingdns.io~1component
      value: security 