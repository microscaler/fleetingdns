apiVersion: compute.gcp.upbound.io/v1beta1
kind: GlobalAddress
metadata:
  name: fleetingdns-global-ip
  labels:
    app.kubernetes.io/name: fleetingdns-global-ip
    app.kubernetes.io/component: networking
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    name: fleetingdns-global-ip
    project: fleetingdns-infra
    description: "Global anycast IPv4 address for FleetingDNS"
    addressType: EXTERNAL
    ipVersion: IPV4
  providerConfigRef:
    name: default
---
