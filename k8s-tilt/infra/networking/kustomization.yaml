apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: fleetingdns-networking
  annotations:
    config.kubernetes.io/local-config: "true"

resources:
# Global IP Addresses
- global-ips/fleetingdns-global-ip.yaml

# SSL Certificates
- ssl-certificates/fleetingdns-certificates.yaml

# Load Balancers
- load-balancers/fleetingdns-load-balancers.yaml

commonLabels:
  app.kubernetes.io/name: fleetingdns-networking
  app.kubernetes.io/component: networking
  app.kubernetes.io/part-of: fleetingdns
  app.kubernetes.io/managed-by: crossplane

patches:
# Add common annotations to all resources
- target:
    group: "*"
    version: "*"
    kind: "*"
  patch: |-
    - op: add
      path: /metadata/annotations/crossplane.io~1managed-by
      value: fleetingdns-platform
    - op: add
      path: /metadata/annotations/fleetingdns.io~1component
      value: networking 