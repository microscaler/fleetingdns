apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: cloud-cdn
  annotations:
    config.kubernetes.io/local-config: "true"

resources:
  - main-cdn-config.yaml
  - api-cdn-config.yaml
  - portal-cdn-config.yaml
  - static-assets-cdn.yaml
  - regional-cdn-configs.yaml

commonLabels:
  app.kubernetes.io/name: fleetingdns-cdn
  app.kubernetes.io/component: networking
  app.kubernetes.io/part-of: fleetingdns-infrastructure 