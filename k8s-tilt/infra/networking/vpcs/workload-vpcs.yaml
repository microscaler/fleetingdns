# Development Environment VPC
apiVersion: compute.gcp.upbound.io/v1beta1
kind: Network
metadata:
  name: fleetingdns-dev-vpc
  labels:
    app.kubernetes.io/name: fleetingdns-dev-vpc
    app.kubernetes.io/component: networking
    app.kubernetes.io/part-of: fleetingdns
    app.kubernetes.io/environment: development
spec:
  forProvider:
    name: fleetingdns-dev-vpc
    project: fleetingdns-dev
    description: "Development VPC for FleetingDNS"
    autoCreateSubnetworks: false
    routingMode: REGIONAL
  providerConfigRef:
    name: default
---
apiVersion: compute.gcp.upbound.io/v1beta1
kind: Subnetwork
metadata:
  name: fleetingdns-dev-workload
  labels:
    app.kubernetes.io/name: fleetingdns-dev-workload
    app.kubernetes.io/component: networking
    app.kubernetes.io/part-of: fleetingdns
    app.kubernetes.io/environment: development
spec:
  forProvider:
    name: fleetingdns-dev-workload
    project: fleetingdns-dev
    region: europe-west1
    network: fleetingdns-dev-vpc
    ipCidrRange: "10.16.0.0/20"
    description: "Development workload subnet"
    privateIpGoogleAccess: true
    secondaryIpRange:
    - rangeName: pods
      ipCidrRange: "10.32.0.0/16"
    - rangeName: services
      ipCidrRange: "10.48.0.0/20"
  providerConfigRef:
    name: default
---
