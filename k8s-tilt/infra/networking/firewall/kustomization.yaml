apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: advanced-firewall
  annotations:
    config.kubernetes.io/local-config: "true"

resources:
  - infra-firewall-rules.yaml
  - workload-firewall-rules.yaml
  - security-firewall-rules.yaml
  - analytics-firewall-rules.yaml
  - zero-trust-rules.yaml

commonLabels:
  app.kubernetes.io/name: fleetingdns-firewall
  app.kubernetes.io/component: security
  app.kubernetes.io/part-of: fleetingdns-infrastructure 