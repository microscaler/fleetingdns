apiVersion: compute.gcp.upbound.io/v1beta1
kind: Firewall
metadata:
  name: workload-allow-internal
  labels:
    app.kubernetes.io/name: workload-allow-internal
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fleetingdns-infrastructure
    fleetingdns.com/environment: workload
spec:
  forProvider:
    name: workload-allow-internal
    networkRef:
      name: fleetingdns-dev-vpc
    description: "Allow internal pod-to-pod communication"
    direction: INGRESS
    priority: 1300
    sourceRanges:
      - "10.16.0.0/16"  # Pod CIDR
    allow:
      - protocol: tcp
      - protocol: udp
      - protocol: icmp
  providerConfigRef:
    name: gcp-provider-config-dev
---
apiVersion: compute.gcp.upbound.io/v1beta1
kind: Firewall
metadata:
  name: workload-allow-health-checks
  labels:
    app.kubernetes.io/name: workload-allow-health-checks
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fleetingdns-infrastructure
    fleetingdns.com/environment: workload
spec:
  forProvider:
    name: workload-allow-health-checks
    networkRef:
      name: fleetingdns-dev-vpc
    description: "Allow GCP load balancer health checks"
    direction: INGRESS
    priority: 1400
    sourceRanges:
      - "35.191.0.0/16"  # GCP health check ranges
      - "130.211.0.0/22"
    allow:
      - protocol: tcp
  providerConfigRef:
    name: gcp-provider-config-dev 