apiVersion: compute.gcp.upbound.io/v1beta1
kind: Firewall
metadata:
  name: workload-allow-dns
  labels:
    app.kubernetes.io/name: workload-allow-dns
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fleetingdns-infrastructure
    fleetingdns.com/environment: workload
spec:
  forProvider:
    name: workload-allow-dns
    networkRef:
      name: fleetingdns-dev-vpc
    description: "Allow DNS traffic from internet to FleetingDNS service"
    direction: INGRESS
    priority: 1000
    sourceRanges:
      - "0.0.0.0/0"
    targetTags:
      - "fleetingdns-dnsd"
    allow:
      - protocol: udp
        ports:
          - "53"
      - protocol: tcp
        ports:
          - "53"
          - "853"  # DNS over TLS
  providerConfigRef:
    name: gcp-provider-config-dev
---
apiVersion: compute.gcp.upbound.io/v1beta1
kind: Firewall
metadata:
  name: workload-allow-api
  labels:
    app.kubernetes.io/name: workload-allow-api
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: fleetingdns-infrastructure
    fleetingdns.com/environment: workload
spec:
  forProvider:
    name: workload-allow-api
    networkRef:
      name: fleetingdns-dev-vpc
    description: "Allow HTTPS API traffic through Cloud Armor"
    direction: INGRESS
    priority: 1100
    sourceRanges:
      - "0.0.0.0/0"
    targetTags:
      - "fleetingdns-api"
    allow:
      - protocol: tcp
        ports:
          - "443"
          - "80"
  providerConfigRef:
    name: gcp-provider-config-dev
---
