apiVersion: compute.gcp.upbound.io/v1beta1
kind: NetworkPeering
metadata:
  name: infra-to-security-peering
  labels:
    app.kubernetes.io/name: infra-to-security-peering
    app.kubernetes.io/component: networking
    app.kubernetes.io/part-of: fleetingdns-infrastructure
    fleetingdns.com/environment: infrastructure
    fleetingdns.com/region: global
spec:
  forProvider:
    name: infra-to-security-peering
    networkRef:
      name: fleetingdns-infra-vpc
    peerNetwork: "projects/fleetingdns-security/global/networks/fleetingdns-security-vpc"
    autoCreateRoutes: true
    importCustomRoutes: true
    exportCustomRoutes: true
  providerConfigRef:
    name: gcp-provider-config-infra
---
apiVersion: compute.gcp.upbound.io/v1beta1
kind: NetworkPeering
metadata:
  name: security-to-infra-peering
  labels:
    app.kubernetes.io/name: security-to-infra-peering
    app.kubernetes.io/component: networking
    app.kubernetes.io/part-of: fleetingdns-infrastructure
    fleetingdns.com/environment: security
    fleetingdns.com/region: global
spec:
  forProvider:
    name: security-to-infra-peering
    networkRef:
      name: fleetingdns-security-vpc
    peerNetwork: "projects/fleetingdns-infra/global/networks/fleetingdns-infra-vpc"
    autoCreateRoutes: true
    importCustomRoutes: true
    exportCustomRoutes: true
  providerConfigRef:
    name: gcp-provider-config-security 