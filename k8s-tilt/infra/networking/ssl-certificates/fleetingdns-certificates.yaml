apiVersion: compute.gcp.upbound.io/v1beta1
kind: ManagedSSLCertificate
metadata:
  name: fleetingdns-wildcard-cert
  labels:
    app.kubernetes.io/name: fleetingdns-wildcard-cert
    app.kubernetes.io/component: networking
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    name: fleetingdns-wildcard-cert
    project: fleetingdns-infra
    description: "Wildcard SSL certificate for *.fleetingdns.com"
    managed:
    - domains:
      - "fleetingdns.com"
      - "*.fleetingdns.com"
  providerConfigRef:
    name: default
---
