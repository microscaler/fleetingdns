# Additional Provider Configurations for Multi-Project Setup

# Development Environment Provider Config
apiVersion: gcp.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: development
  labels:
    app.kubernetes.io/name: development-provider-config
    app.kubernetes.io/component: crossplane-config
    app.kubernetes.io/part-of: fleetingdns
spec:
  projectID: fleetingdns-dev
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: gcp-secret
      key: creds
---
