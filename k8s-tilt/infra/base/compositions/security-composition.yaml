apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xsecurity-composition
  labels:
    provider: gcp
    service: security
spec:
  compositeTypeRef:
    apiVersion: fleetingdns.io/v1alpha1
    kind: XSecurity
  
  writeConnectionSecretsToNamespace: crossplane-system
  
  resources:
  # Cloud Armor Security Policy
  - name: cloud-armor-policy
    base:
      apiVersion: compute.gcp.upbound.io/v1beta1
      kind: SecurityPolicy
      spec:
        forProvider:
          name: ""
          project: ""
          description: "Cloud Armor security policy for FleetingDNS"
          adaptiveProtectionConfig:
          - layer7DdosDefenseConfig:
            - enable: true
              ruleVisibility: STANDARD
          rule:
          - action: allow
            priority: 2147483647
            match:
            - versionedExpr: SRC_IPS_V1
              config:
              - srcIpRanges:
                - "*"
            description: "Default allow rule"
          - action: deny(403)
            priority: 1000
            match:
            - expr:
              - expression: 'origin.region_code == "CN" || origin.region_code == "RU"'
            description: "Block traffic from high-risk countries"
          - action: throttle
            priority: 2000
            match:
            - versionedExpr: SRC_IPS_V1
              config:
              - srcIpRanges:
                - "*"
            description: "Rate limiting rule"
            rateLimitOptions:
            - conformAction: allow
              exceedAction: deny(429)
              enforceOnKey: IP
              rateLimitThreshold:
              - count: 100
                intervalSec: 60
        providerConfigRef:
          name: default
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.cloudArmor.policyName
      toFieldPath: spec.forProvider.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.projectId
      toFieldPath: spec.forProvider.project
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.cloudArmor.description
      toFieldPath: spec.forProvider.description
    - type: ToCompositeFieldPath
      fromFieldPath: status.atProvider.id
      toFieldPath: status.cloudArmorPolicyId

  # IAP Brand (OAuth Consent Screen)
  - name: iap-brand
    base:
      apiVersion: iap.gcp.upbound.io/v1beta1
      kind: Brand
      spec:
        forProvider:
          project: ""
          supportEmail: ""
          applicationTitle: ""
        providerConfigRef:
          name: default
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.projectId
      toFieldPath: spec.forProvider.project
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.iap.brand.supportEmail
      toFieldPath: spec.forProvider.supportEmail
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.iap.brand.applicationTitle
      toFieldPath: spec.forProvider.applicationTitle

  # IAP OAuth Client
  - name: iap-client
    base:
      apiVersion: iap.gcp.upbound.io/v1beta1
      kind: Client
      spec:
        forProvider:
          displayName: ""
          brand: ""
        providerConfigRef:
          name: default
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.iap.oauthClient.displayName
      toFieldPath: spec.forProvider.displayName
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.projectId
      toFieldPath: spec.forProvider.brand
      transforms:
      - type: string
        string:
          fmt: "projects/%s/brands/%s"
    - type: ToCompositeFieldPath
      fromFieldPath: status.atProvider.clientId
      toFieldPath: status.iapClientId

  # Binary Authorization Policy
  - name: binary-authorization-policy
    base:
      apiVersion: binaryauthorization.gcp.upbound.io/v1beta1
      kind: Policy
      spec:
        forProvider:
          project: ""
          description: "Binary Authorization policy for FleetingDNS"
          defaultAdmissionRule:
          - evaluationMode: REQUIRE_ATTESTATION
            enforcementMode: ENFORCED_BLOCK_AND_AUDIT_LOG
            requireAttestationsBy: []
          globalPolicyEvaluationMode: ENABLE
        providerConfigRef:
          name: default
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.projectId
      toFieldPath: spec.forProvider.project
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.binaryAuthorization.defaultAdmissionRule.evaluationMode
      toFieldPath: spec.forProvider.defaultAdmissionRule[0].evaluationMode
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.binaryAuthorization.defaultAdmissionRule.enforcementMode
      toFieldPath: spec.forProvider.defaultAdmissionRule[0].enforcementMode
    - type: ToCompositeFieldPath
      fromFieldPath: status.atProvider.id
      toFieldPath: status.binaryAuthorizationPolicyId

  # Container Analysis Note (for vulnerability scanning)
  - name: vulnerability-note
    base:
      apiVersion: containeranalysis.gcp.upbound.io/v1beta1
      kind: Note
      spec:
        forProvider:
          name: ""
          project: ""
          shortDescription: "Vulnerability scanning note for FleetingDNS"
          longDescription: "Container vulnerability analysis for FleetingDNS images"
          vulnerabilityAssessment:
          - shortDescription: "Vulnerability assessment"
            longDescription: "Automated vulnerability scanning for container images"
        providerConfigRef:
          name: default
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.name
      toFieldPath: spec.forProvider.name
      transforms:
      - type: string
        string:
          fmt: "%s-vulnerability-note"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.projectId
      toFieldPath: spec.forProvider.project

  # Security Command Center Notification Config
  - name: scc-notification
    base:
      apiVersion: securitycenter.gcp.upbound.io/v1beta1
      kind: NotificationConfig
      spec:
        forProvider:
          configId: ""
          organization: ""
          description: "Security Command Center notifications for FleetingDNS"
          pubsubTopic: ""
          streamingConfig:
          - filter: 'state="ACTIVE" AND NOT mute="MUTED"'
        providerConfigRef:
          name: default
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.name
      toFieldPath: spec.forProvider.configId
      transforms:
      - type: string
        string:
          fmt: "%s-scc-notifications"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.projectId
      toFieldPath: spec.forProvider.pubsubTopic
      transforms:
      - type: string
        string:
          fmt: "projects/%s/topics/security-notifications"

  # Web Security Scanner Scan Config
  - name: web-security-scanner
    base:
      apiVersion: websecurityscanner.gcp.upbound.io/v1beta1
      kind: ScanConfig
      spec:
        forProvider:
          displayName: ""
          project: ""
          startingUrls:
          - ""
          targetPlatforms:
          - "COMPUTE"
          userAgent: "CHROME_LINUX"
          maxQps: 5
          authentication:
          - googleAccount:
            - username: ""
            - password: ""
        providerConfigRef:
          name: default
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.name
      toFieldPath: spec.forProvider.displayName
      transforms:
      - type: string
        string:
          fmt: "%s-web-scanner"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.projectId
      toFieldPath: spec.forProvider.project

  # IAM Policy for IAP Access
  - name: iap-access-policy
    base:
      apiVersion: iam.gcp.upbound.io/v1beta1
      kind: ProjectIAMBinding
      spec:
        forProvider:
          project: ""
          role: roles/iap.httpsResourceAccessor
          members: []
        providerConfigRef:
          name: default
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.projectId
      toFieldPath: spec.forProvider.project
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.iap.accessPolicy.bindings[0].members
      toFieldPath: spec.forProvider.members

  # Service Account for Security Operations
  - name: security-service-account
    base:
      apiVersion: iam.gcp.upbound.io/v1beta1
      kind: ServiceAccount
      spec:
        forProvider:
          accountId: ""
          displayName: "FleetingDNS Security Service Account"
          description: "Service account for security operations and monitoring"
          project: ""
        providerConfigRef:
          name: default
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.name
      toFieldPath: spec.forProvider.accountId
      transforms:
      - type: string
        string:
          fmt: "%s-security-sa"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.projectId
      toFieldPath: spec.forProvider.project

  # IAM Binding for Security Service Account
  - name: security-sa-binding
    base:
      apiVersion: iam.gcp.upbound.io/v1beta1
      kind: ProjectIAMBinding
      spec:
        forProvider:
          project: ""
          role: roles/securitycenter.editor
          members: []
        providerConfigRef:
          name: default
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.parameters.projectId
      toFieldPath: spec.forProvider.project
    - type: CombineFromComposite
      combine:
        variables:
        - fromFieldPath: spec.parameters.name
        - fromFieldPath: spec.parameters.projectId
        strategy: string
        string:
          fmt: "serviceAccount:%s-security-sa@%s.iam.gserviceaccount.com"
      toFieldPath: spec.forProvider.members[0] 