apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: oauth-clients
  annotations:
    config.kubernetes.io/local-config: "true"

resources:
  - admin-oauth-client.yaml
  - developer-oauth-client.yaml
  - monitoring-oauth-client.yaml
  - analytics-oauth-client.yaml

commonLabels:
  app.kubernetes.io/name: fleetingdns-oauth-clients
  app.kubernetes.io/component: identity
  app.kubernetes.io/part-of: fleetingdns-infrastructure 