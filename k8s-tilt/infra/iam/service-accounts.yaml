# Kubernetes Service Account for FleetingDNS API
apiVersion: iam.gcp.upbound.io/v1beta1
kind: ServiceAccount
metadata:
  name: fleetingdns-api-sa
  labels:
    app.kubernetes.io/name: fleetingdns-api-sa
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    accountId: fleetingdns-api
    project: fleetingdns-infra
    displayName: "FleetingDNS API Service Account"
    description: "Service account for FleetingDNS API services"
  providerConfigRef:
    name: default
---
