# Workload Identity Pool for Kubernetes
apiVersion: iam.gcp.upbound.io/v1beta1
kind: WorkloadIdentityPool
metadata:
  name: fleetingdns-k8s-pool
  labels:
    app.kubernetes.io/name: fleetingdns-k8s-pool
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    workloadIdentityPoolId: fleetingdns-k8s-pool
    project: fleetingdns-infra
    displayName: "FleetingDNS Kubernetes Workload Identity Pool"
    description: "Workload Identity pool for FleetingDNS Kubernetes clusters"
    disabled: false
  providerConfigRef:
    name: default
---
# Workload Identity Pool Provider for Kubernetes
apiVersion: iam.gcp.upbound.io/v1beta1
kind: WorkloadIdentityPoolProvider
metadata:
  name: fleetingdns-k8s-provider
  labels:
    app.kubernetes.io/name: fleetingdns-k8s-provider
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    workloadIdentityPoolProviderId: fleetingdns-k8s-provider
    project: fleetingdns-infra
    workloadIdentityPoolId: fleetingdns-k8s-pool
    displayName: "FleetingDNS Kubernetes Provider"
    description: "Workload Identity provider for FleetingDNS Kubernetes clusters"
    disabled: false
    oidc:
    - issuerUri: "https://container.googleapis.com/v1/projects/fleetingdns-infra/locations/europe-west1/clusters/fleetingdns-infra-cluster"
    attributeMapping:
      "google.subject": "assertion.sub"
      "attribute.namespace": "assertion['kubernetes.io']['namespace']"
      "attribute.service_account": "assertion['kubernetes.io']['serviceaccount']['name']"
      "attribute.pod": "assertion['kubernetes.io']['pod']['name']"
  providerConfigRef:
    name: default 