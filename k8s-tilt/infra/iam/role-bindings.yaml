# API Service Account Bindings
apiVersion: iam.gcp.upbound.io/v1beta1
kind: ProjectIAMBinding
metadata:
  name: fleetingdns-api-secret-accessor
  labels:
    app.kubernetes.io/name: fleetingdns-api-secret-accessor
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    project: fleetingdns-infra
    role: roles/secretmanager.secretAccessor
    members:
    - "serviceAccount:fleetingdns-api@fleetingdns-infra.iam.gserviceaccount.com"
  providerConfigRef:
    name: default
---
apiVersion: iam.gcp.upbound.io/v1beta1
