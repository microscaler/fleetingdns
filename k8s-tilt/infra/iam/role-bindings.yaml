    app.kubernetes.io/name: fleetingdns-api-workload-identity
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    serviceAccountId: "projects/fleetingdns-infra/serviceAccounts/fleetingdns-api@fleetingdns-infra.iam.gserviceaccount.com"
    role: roles/iam.workloadIdentityUser
    members:
    - "serviceAccount:fleetingdns-infra.svc.id.goog[fleetingdns/fleetingdns-api]"
  providerConfigRef:
    name: default
---
