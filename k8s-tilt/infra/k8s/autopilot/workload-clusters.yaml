# Development Autopilot Cluster
apiVersion: container.gcp.upbound.io/v1beta1
kind: Cluster
metadata:
  name: fleetingdns-dev-cluster
  labels:
    app.kubernetes.io/name: fleetingdns-dev-cluster
    app.kubernetes.io/component: k8s-cluster
    app.kubernetes.io/part-of: fleetingdns
    app.kubernetes.io/environment: development
spec:
  forProvider:
    name: fleetingdns-dev-cluster
    project: fleetingdns-dev
    location: europe-west1  # Regional cluster for Autopilot
    description: "Development Autopilot cluster for FleetingDNS workloads"
    
    # Enable Autopilot
    enableAutopilot: true
    
    # Network Configuration
    network: "projects/fleetingdns-dev/global/networks/fleetingdns-dev-vpc"
    subnetwork: "projects/fleetingdns-dev/regions/europe-west1/subnetworks/fleetingdns-dev-workload"
    
    # IP Allocation Policy for Pods and Services
    ipAllocationPolicy:
    - clusterSecondaryRangeName: pods
      servicesSecondaryRangeName: services
    
    # Networking Mode
    networkingMode: VPC_NATIVE
    
    # Private Cluster Configuration
    privateClusterConfig:
    - enablePrivateNodes: true
      enablePrivateEndpoint: false
      masterIpv4CidrBlock: "172.16.1.0/28"
      masterAuthorizedNetworksConfig:
      - enabled: true
        cidrBlocks:
        - cidrBlock: "0.0.0.0/0"  # Configure specific IPs in production
          displayName: "Development Access"
    
    # Master Auth Configuration
    masterAuth:
    - clientCertificateConfig:
      - issueClientCertificate: false
    
    # Workload Identity Configuration
    workloadIdentityConfig:
    - workloadPool: "fleetingdns-dev.svc.id.goog"
    
    # Maintenance Policy
    maintenancePolicy:
    - dailyMaintenanceWindow:
      - startTime: "02:00"  # 2 AM UTC for dev
    
    # Cluster Features
    enableShieldedNodes: true
    enableLegacyAbac: false
    
    # Logging and Monitoring (simplified for dev)
    loggingConfig:
    - enableComponents:
      - "SYSTEM_COMPONENTS"
      - "WORKLOADS"
    
    monitoringConfig:
    - enableComponents:
      - "SYSTEM_COMPONENTS"
      - "WORKLOADS"
    
    # Resource Labels
    resourceLabels:
      environment: development
      cluster-type: autopilot
      managed-by: crossplane
      purpose: workload
  
  providerConfigRef:
    name: development
---
# Staging Autopilot Cluster
apiVersion: container.gcp.upbound.io/v1beta1
kind: Cluster
metadata:
  name: fleetingdns-staging-cluster
  labels:
    app.kubernetes.io/name: fleetingdns-staging-cluster
    app.kubernetes.io/component: k8s-cluster
    app.kubernetes.io/part-of: fleetingdns
    app.kubernetes.io/environment: staging
spec:
  forProvider:
    name: fleetingdns-staging-cluster
    project: fleetingdns-staging
    location: europe-west1
    description: "Staging Autopilot cluster for FleetingDNS workloads"
    
    # Enable Autopilot
    enableAutopilot: true
    
    # Network Configuration
    network: "projects/fleetingdns-staging/global/networks/fleetingdns-staging-vpc"
    subnetwork: "projects/fleetingdns-staging/regions/europe-west1/subnetworks/fleetingdns-staging-workload"
    
    # IP Allocation Policy for Pods and Services
    ipAllocationPolicy:
    - clusterSecondaryRangeName: pods
      servicesSecondaryRangeName: services
    
    # Networking Mode
    networkingMode: VPC_NATIVE
    
    # Private Cluster Configuration
    privateClusterConfig:
    - enablePrivateNodes: true
      enablePrivateEndpoint: false
      masterIpv4CidrBlock: "172.16.2.0/28"
      masterAuthorizedNetworksConfig:
      - enabled: true
        cidrBlocks:
        - cidrBlock: "0.0.0.0/0"
          displayName: "Staging Access"
    
    # Master Auth Configuration
    masterAuth:
    - clientCertificateConfig:
      - issueClientCertificate: false
    
    # Workload Identity Configuration
    workloadIdentityConfig:
    - workloadPool: "fleetingdns-staging.svc.id.goog"
    
    # Binary Authorization (enabled for staging)
    binaryAuthorization:
    - evaluationMode: PROJECT_SINGLETON_POLICY_ENFORCE
    
    # Maintenance Policy
    maintenancePolicy:
    - dailyMaintenanceWindow:
      - startTime: "01:00"  # 1 AM UTC for staging
    
    # Cluster Features
    enableShieldedNodes: true
    enableLegacyAbac: false
    
    # Logging and Monitoring
    loggingConfig:
    - enableComponents:
      - "SYSTEM_COMPONENTS"
      - "WORKLOADS"
      - "API_SERVER"
    
    monitoringConfig:
    - enableComponents:
      - "SYSTEM_COMPONENTS"
      - "WORKLOADS"
      - "APISERVER"
    
    # Resource Labels
    resourceLabels:
      environment: staging
      cluster-type: autopilot
      managed-by: crossplane
      purpose: workload
  
  providerConfigRef:
    name: staging
---
