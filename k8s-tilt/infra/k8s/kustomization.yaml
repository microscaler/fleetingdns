apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: fleetingdns-k8s-clusters
  annotations:
    config.kubernetes.io/local-config: "true"

resources:
# Infrastructure Control Plane (GKE Standard)
- gke/infrastructure-cluster.yaml

# Workload Clusters (GKE Autopilot)
- autopilot/

commonLabels:
  app.kubernetes.io/name: fleetingdns-k8s-clusters
  app.kubernetes.io/component: k8s-cluster
  app.kubernetes.io/part-of: fleetingdns
  app.kubernetes.io/managed-by: crossplane

patches:
- target:
    group: "*"
    version: "*"
    kind: "*"
  patch: |-
    - op: add
      path: /metadata/annotations/crossplane.io~1managed-by
      value: fleetingdns-platform 