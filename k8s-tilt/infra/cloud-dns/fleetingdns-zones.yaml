# Main FleetingDNS DNS Zone
apiVersion: dns.gcp.upbound.io/v1beta1
kind: ManagedZone
metadata:
  name: fleetingdns-com-zone
  labels:
    app.kubernetes.io/name: fleetingdns-com-zone
    app.kubernetes.io/component: cloud-dns
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    name: fleetingdns-com
    project: fleetingdns-infra
    dnsName: "fleetingdns.com."
    description: "Main DNS zone for fleetingdns.com"
    visibility: public
    labels:
      environment: production
      domain: primary
      managed-by: crossplane
  providerConfigRef:
    name: default
---
# A Record for Main Domain
apiVersion: dns.gcp.upbound.io/v1beta1
kind: RecordSet
metadata:
  name: fleetingdns-com-a
  labels:
    app.kubernetes.io/name: fleetingdns-com-a
    app.kubernetes.io/component: cloud-dns
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    name: "fleetingdns.com."
    project: fleetingdns-infra
    managedZone: fleetingdns-com
    type: A
    ttl: 300
    rrdatas:
    - "34.102.136.180"  # Replace with actual global IP
  providerConfigRef:
    name: default
---
# AAAA Record for IPv6
apiVersion: dns.gcp.upbound.io/v1beta1
kind: RecordSet
metadata:
  name: fleetingdns-com-aaaa
  labels:
    app.kubernetes.io/name: fleetingdns-com-aaaa
    app.kubernetes.io/component: cloud-dns
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    name: "fleetingdns.com."
    project: fleetingdns-infra
    managedZone: fleetingdns-com
    type: AAAA
    ttl: 300
    rrdatas:
    - "2600:1900:4000:0000:0000:0000:0000:0001"  # Replace with actual IPv6
  providerConfigRef:
    name: default
---
# API Subdomain
apiVersion: dns.gcp.upbound.io/v1beta1
