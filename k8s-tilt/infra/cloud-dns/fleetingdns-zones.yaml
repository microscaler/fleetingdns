# MX Records for Email
apiVersion: dns.gcp.upbound.io/v1beta1
kind: RecordSet
metadata:
  name: fleetingdns-com-mx
  labels:
    app.kubernetes.io/name: fleetingdns-com-mx
    app.kubernetes.io/component: cloud-dns
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    name: "fleetingdns.com."
    project: fleetingdns-infra
    managedZone: fleetingdns-com
    type: MX
    ttl: 3600
    rrdatas:
    - "10 mail.fleetingdns.com."
  providerConfigRef:
    name: default
---
# TXT Records for Domain Verification
apiVersion: dns.gcp.upbound.io/v1beta1
kind: RecordSet
metadata:
  name: fleetingdns-com-txt
  labels:
    app.kubernetes.io/name: fleetingdns-com-txt
    app.kubernetes.io/component: cloud-dns
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    name: "fleetingdns.com."
    project: fleetingdns-infra
    managedZone: fleetingdns-com
    type: TXT
    ttl: 300
    rrdatas:
    - "\"v=spf1 include:_spf.google.com ~all\""
    - "\"google-site-verification=ABCD1234567890\""  # Replace with actual verification
  providerConfigRef:
    name: default
---
# CAA Records for Certificate Authority Authorization
apiVersion: dns.gcp.upbound.io/v1beta1
kind: RecordSet
metadata:
  name: fleetingdns-com-caa
  labels:
    app.kubernetes.io/name: fleetingdns-com-caa
    app.kubernetes.io/component: cloud-dns
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    name: "fleetingdns.com."
    project: fleetingdns-infra
    managedZone: fleetingdns-com
    type: CAA
    ttl: 3600
    rrdatas:
    - "0 issue \"pki.goog\""
    - "0 issue \"letsencrypt.org\""
    - "0 iodef \"mailto:security@fleetingdns.com\""
  providerConfigRef:
    name: default 