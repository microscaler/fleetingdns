# BigQuery Data Transfer for automated data ingestion
apiVersion: bigquerydatatransfer.gcp.upbound.io/v1beta1
kind: Config
metadata:
  name: fleetingdns-logs-transfer
  labels:
    app.kubernetes.io/name: fleetingdns-logs-transfer
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    displayName: "FleetingDNS Logs Transfer"
    project: fleetingdns-analytics
    location: EU
    dataSourceId: "scheduled_query"
    destinationDatasetId: fleetingdns_processed_data
    schedule: "every 15 minutes"
    params:
      query: |
        SELECT
          timestamp,
          severity,
          resource.type as resource_type,
          resource.labels.project_id,
          resource.labels.zone,
          jsonPayload,
          labels,
          logName,
          receiveTimestamp,
          insertId
        FROM `fleetingdns-infra.fleetingdns_raw_data.cloudaudit_googleapis_com_activity_*`
        WHERE _TABLE_SUFFIX = FORMAT_DATE('%Y%m%d', DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY))
      write_disposition: "WRITE_APPEND"
  providerConfigRef:
    name: analytics 