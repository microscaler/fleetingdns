apiVersion: bigquery.gcp.upbound.io/v1beta1
kind: Dataset
metadata:
  name: fleetingdns-raw-data
  labels:
    app.kubernetes.io/name: fleetingdns-raw-data
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    datasetId: fleetingdns_raw_data
    project: fleetingdns-analytics
    description: "Raw data ingestion for FleetingDNS - logs, metrics, events"
    location: EU
    defaultTableExpirationMs: 7776000000  # 90 days
    labels:
      environment: production
      data-tier: raw
      retention: "90-days"
  providerConfigRef:
    name: analytics
