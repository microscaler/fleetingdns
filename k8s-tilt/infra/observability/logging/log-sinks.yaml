apiVersion: logging.gcp.crossplane.io/v1alpha1
kind: ProjectSink
metadata:
  name: fleetingdns-security-logs-sink
  labels:
    app.kubernetes.io/name: fleetingdns-security-logs-sink
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fleetingdns-infrastructure
    fleetingdns.com/log-type: "security"
spec:
  forProvider:
    name: "fleetingdns-security-logs"
    projectRef:
      name: fleetingdns-infra-project
    description: "Security-related logs for FleetingDNS infrastructure"
    destination: "bigquery.googleapis.com/projects/fleetingdns-security/datasets/security_logs"
    filter: |
      (
        protoPayload.serviceName="cloudaudit.googleapis.com" OR
        protoPayload.serviceName="iap.googleapis.com" OR
        protoPayload.serviceName="cloudsql.googleapis.com" OR
        protoPayload.serviceName="container.googleapis.com" OR
        protoPayload.serviceName="dns.googleapis.com" OR
        resource.type="gce_firewall_rule" OR
        resource.type="gce_network" OR
        resource.type="gke_cluster" OR
        severity >= "WARNING"
      ) AND (
        protoPayload.authenticationInfo.principalEmail !~ ".*@system.gserviceaccount.com" OR
        protoPayload.methodName =~ ".*delete.*" OR
        protoPayload.methodName =~ ".*create.*" OR
        protoPayload.methodName =~ ".*update.*" OR
        protoPayload.methodName =~ ".*setIamPolicy.*"
      )
    uniqueWriterIdentity: true
    bigqueryOptions:
      usePartitionedTables: true
      usesTimestampColumnPartitioning: true
  providerConfigRef:
    name: gcp-provider-config-infra
---
apiVersion: logging.gcp.crossplane.io/v1alpha1
kind: ProjectSink
metadata:
  name: fleetingdns-application-logs-sink
  labels:
    app.kubernetes.io/name: fleetingdns-application-logs-sink
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fleetingdns-infrastructure
    fleetingdns.com/log-type: "application"
spec:
  forProvider:
    name: "fleetingdns-application-logs"
    projectRef:
      name: fleetingdns-prod-eu-project
    description: "Application logs for FleetingDNS services"
    destination: "bigquery.googleapis.com/projects/fleetingdns-analytics/datasets/application_logs"
    filter: |
      resource.type="k8s_container" AND
      (
        resource.labels.container_name="fleetingdns-api" OR
        resource.labels.container_name="fleetingdns-dnsd" OR
        resource.labels.container_name="fleetingdns-edgehub" OR
        resource.labels.container_name="fleetingdns-feed-grpc" OR
        resource.labels.container_name="fleetingdns-feed-webhook" OR
        resource.labels.container_name="fleetingdns-intake-collector" OR
        resource.labels.container_name="fleetingdns-ml-scorer"
      ) AND
      severity >= "INFO"
    uniqueWriterIdentity: true
    bigqueryOptions:
      usePartitionedTables: true
      usesTimestampColumnPartitioning: true
  providerConfigRef:
    name: gcp-provider-config-prod-eu
---
apiVersion: logging.gcp.crossplane.io/v1alpha1
kind: ProjectSink
metadata:
  name: fleetingdns-dns-query-logs-sink
  labels:
    app.kubernetes.io/name: fleetingdns-dns-query-logs-sink
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fleetingdns-infrastructure
    fleetingdns.com/log-type: "dns-queries"
spec:
  forProvider:
    name: "fleetingdns-dns-query-logs"
    projectRef:
      name: fleetingdns-prod-eu-project
    description: "DNS query logs for threat intelligence and analytics"
    destination: "bigquery.googleapis.com/projects/fleetingdns-analytics/datasets/dns_query_logs"
    filter: |
      resource.type="dns_query" OR
      (
        resource.type="k8s_container" AND
        resource.labels.container_name="fleetingdns-dnsd" AND
        jsonPayload.query_type IS NOT NULL
      ) OR
      (
        resource.type="gce_instance" AND
        jsonPayload.dns_request IS NOT NULL
      )
    uniqueWriterIdentity: true
    bigqueryOptions:
      usePartitionedTables: true
      usesTimestampColumnPartitioning: true
  providerConfigRef:
    name: gcp-provider-config-prod-eu
---
apiVersion: logging.gcp.crossplane.io/v1alpha1
kind: ProjectSink
metadata:
  name: fleetingdns-threat-intel-logs-sink
  labels:
    app.kubernetes.io/name: fleetingdns-threat-intel-logs-sink
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fleetingdns-infrastructure
    fleetingdns.com/log-type: "threat-intelligence"
spec:
  forProvider:
    name: "fleetingdns-threat-intel-logs"
    projectRef:
      name: fleetingdns-security-project
    description: "Threat intelligence logs from honeypots and security systems"
    destination: "pubsub.googleapis.com/projects/fleetingdns-security/topics/threat-intelligence-stream"
    filter: |
      (
        jsonPayload.threat_score > 0.7 OR
        jsonPayload.honeypot_detection = true OR
        jsonPayload.malicious_ip IS NOT NULL OR
        jsonPayload.attack_signature IS NOT NULL OR
        jsonPayload.dns_tunneling_detected = true OR
        jsonPayload.dot_pinning_attack = true
      ) AND
      severity >= "WARNING"
    uniqueWriterIdentity: true
  providerConfigRef:
    name: gcp-provider-config-security
---
apiVersion: logging.gcp.crossplane.io/v1alpha1
kind: ProjectSink
metadata:
  name: fleetingdns-performance-logs-sink
  labels:
    app.kubernetes.io/name: fleetingdns-performance-logs-sink
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fleetingdns-infrastructure
    fleetingdns.com/log-type: "performance"
spec:
  forProvider:
    name: "fleetingdns-performance-logs"
    projectRef:
      name: fleetingdns-analytics-project
    description: "Performance and latency logs for optimization"
    destination: "bigquery.googleapis.com/projects/fleetingdns-analytics/datasets/performance_logs"
    filter: |
      (
        resource.type="http_load_balancer" OR
        resource.type="tcp_lb_rule" OR
        resource.type="gke_cluster" OR
        resource.type="k8s_container"
      ) AND
      (
        httpRequest.latency > "100ms" OR
        jsonPayload.response_time_ms > 100 OR
        jsonPayload.cpu_usage > 0.8 OR
        jsonPayload.memory_usage > 0.8 OR
        jsonPayload.dns_resolution_time_ms > 50
      )
    uniqueWriterIdentity: true
    bigqueryOptions:
      usePartitionedTables: true
      usesTimestampColumnPartitioning: true
  providerConfigRef:
    name: gcp-provider-config-analytics
---
apiVersion: logging.gcp.crossplane.io/v1alpha1
kind: ProjectSink
metadata:
  name: fleetingdns-error-logs-sink
  labels:
    app.kubernetes.io/name: fleetingdns-error-logs-sink
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fleetingdns-infrastructure
    fleetingdns.com/log-type: "errors"
spec:
  forProvider:
    name: "fleetingdns-error-logs"
    projectRef:
      name: fleetingdns-infra-project
    description: "Error logs for immediate alerting and debugging"
    destination: "pubsub.googleapis.com/projects/fleetingdns-security/topics/error-alerts"
    filter: |
      severity >= "ERROR" OR
      (
        severity = "WARNING" AND
        (
          jsonPayload.error_count > 10 OR
          jsonPayload.failure_rate > 0.05 OR
          httpRequest.status >= 500
        )
      )
    uniqueWriterIdentity: true
  providerConfigRef:
    name: gcp-provider-config-infra 