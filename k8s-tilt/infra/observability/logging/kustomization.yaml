apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: advanced-logging
  annotations:
    config.kubernetes.io/local-config: "true"

resources:
  - log-sinks.yaml
  - log-metrics.yaml
  - log-based-alerts.yaml
  - structured-logging.yaml
  - audit-logging.yaml

commonLabels:
  app.kubernetes.io/name: fleetingdns-logging
  app.kubernetes.io/component: observability
  app.kubernetes.io/part-of: fleetingdns-infrastructure 