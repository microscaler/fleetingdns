apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetingdns-error-reporting-config
  labels:
    app.kubernetes.io/name: fleetingdns-error-reporting-config
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fleetingdns-infrastructure
data:
  error-reporting-config.yaml: |
    # Error Reporting configuration for FleetingDNS services
    project_id: "fleetingdns-analytics"
    
    # Service configuration
    services:
      fleetingdns-api:
        enabled: true
        service_name: "fleetingdns-api"
        service_version: "${API_VERSION}"
        error_threshold: 10  # Report after 10 similar errors
        ignore_errors:
          - "context canceled"
          - "connection reset by peer"
          - "broken pipe"
        
      fleetingdns-dnsd:
        enabled: true
        service_name: "fleetingdns-dnsd"
        service_version: "${DNSD_VERSION}"
        error_threshold: 50  # Higher threshold for DNS service
        ignore_errors:
          - "no such host"
          - "connection refused"
          - "timeout"
        
      fleetingdns-edgehub:
        enabled: true
        service_name: "fleetingdns-edgehub"
        service_version: "${EDGEHUB_VERSION}"
        error_threshold: 5   # Lower threshold for tunnel service
        critical_errors:
          - "tunnel_establishment_failed"
          - "authentication_failed"
          - "certificate_validation_failed"
        
      fleetingdns-feed-grpc:
        enabled: true
        service_name: "fleetingdns-feed-grpc"
        service_version: "${FEED_GRPC_VERSION}"
        error_threshold: 20
        
      fleetingdns-feed-webhook:
        enabled: true
        service_name: "fleetingdns-feed-webhook"
        service_version: "${FEED_WEBHOOK_VERSION}"
        error_threshold: 15
        
      fleetingdns-intake-collector:
        enabled: true
        service_name: "fleetingdns-intake-collector"
        service_version: "${INTAKE_VERSION}"
        error_threshold: 25
        
      fleetingdns-ml-scorer:
        enabled: true
        service_name: "fleetingdns-ml-scorer"
        service_version: "${ML_SCORER_VERSION}"
        error_threshold: 10
        critical_errors:
          - "model_loading_failed"
          - "prediction_failed"
          - "feature_extraction_failed"
    
    # Error categorization
    error_categories:
      authentication:
        patterns:
          - "*authentication*failed*"
          - "*unauthorized*"
          - "*invalid*token*"
          - "*permission*denied*"
        severity: "high"
        notification_channels:
          - "security-team"
          - "on-call-engineer"
      
      dns_resolution:
        patterns:
          - "*dns*resolution*failed*"
          - "*no*such*host*"
          - "*dns*timeout*"
          - "*dns*server*error*"
        severity: "medium"
        notification_channels:
          - "dns-team"
          - "sre-team"
      
      tunnel_connectivity:
        patterns:
          - "*tunnel*failed*"
          - "*connection*refused*"
          - "*handshake*failed*"
          - "*tls*error*"
        severity: "high"
        notification_channels:
          - "network-team"
          - "on-call-engineer"
      
      database_connectivity:
        patterns:
          - "*database*connection*"
          - "*sql*error*"
          - "*connection*pool*"
          - "*deadlock*"
        severity: "critical"
        notification_channels:
          - "database-team"
          - "on-call-engineer"
          - "engineering-lead"
      
      ml_processing:
        patterns:
          - "*model*error*"
          - "*prediction*failed*"
          - "*feature*extraction*"
          - "*scoring*error*"
        severity: "medium"
        notification_channels:
          - "ml-team"
          - "data-team"
      
      security_threats:
        patterns:
          - "*threat*detected*"
          - "*attack*blocked*"
          - "*malicious*activity*"
          - "*honeypot*triggered*"
        severity: "high"
        notification_channels:
          - "security-team"
          - "threat-intel-team"
    
    # Notification configuration
    notifications:
      channels:
        security-team:
          type: "email"
          address: "security@fleetingdns.com"
          immediate: true
        
        on-call-engineer:
          type: "pagerduty"
          integration_key: "${PAGERDUTY_INTEGRATION_KEY}"
          immediate: true
        
        engineering-lead:
          type: "slack"
          webhook_url: "${SLACK_ENGINEERING_WEBHOOK}"
          immediate: false
        
        dns-team:
          type: "email"
          address: "dns-team@fleetingdns.com"
          immediate: false
        
        sre-team:
          type: "slack"
          webhook_url: "${SLACK_SRE_WEBHOOK}"
          immediate: false
        
        network-team:
          type: "email"
          address: "network@fleetingdns.com"
          immediate: false
        
        database-team:
          type: "email"
          address: "database@fleetingdns.com"
          immediate: true
        
        ml-team:
          type: "slack"
          webhook_url: "${SLACK_ML_WEBHOOK}"
          immediate: false
        
        data-team:
          type: "email"
          address: "data@fleetingdns.com"
          immediate: false
        
        threat-intel-team:
          type: "email"
          address: "threat-intel@fleetingdns.com"
          immediate: true
    
    # Error aggregation rules
    aggregation:
      time_window: "5m"
      group_by:
        - "service_name"
        - "error_type"
        - "cluster_name"
        - "environment"
      
      thresholds:
        critical: 100    # 100 errors in 5 minutes
        high: 50        # 50 errors in 5 minutes
        medium: 20      # 20 errors in 5 minutes
        low: 10         # 10 errors in 5 minutes
    
    # Integration with other systems
    integrations:
      cloud_trace:
        enabled: true
        link_traces: true
        trace_sampling: 0.1  # Sample 10% of error traces
      
      security_command_center:
        enabled: true
        create_findings: true
        finding_categories:
          - "AUTHENTICATION_ERROR"
          - "SECURITY_THREAT"
          - "MALICIOUS_ACTIVITY"
      
      bigquery:
        enabled: true
        dataset: "error_analytics"
        table: "error_reports"
        streaming_insert: true
      
      prometheus:
        enabled: true
        metrics_prefix: "fleetingdns_errors"
        labels:
          - "service_name"
          - "error_category"
          - "severity"
          - "environment"
---
apiVersion: monitoring.gcp.crossplane.io/v1alpha1
kind: AlertPolicy
metadata:
  name: fleetingdns-critical-error-alert
  labels:
    app.kubernetes.io/name: fleetingdns-critical-error-alert
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fleetingdns-infrastructure
    fleetingdns.com/alert-type: "error-reporting"
    fleetingdns.com/severity: "critical"
spec:
  forProvider:
    projectRef:
      name: fleetingdns-analytics-project
    displayName: "FleetingDNS Critical Error Rate"
    documentation:
      content: |
        Critical error rate threshold exceeded in FleetingDNS services.
        
        This indicates a serious issue that requires immediate attention:
        - Service degradation or outage
        - Security incident
        - Infrastructure failure
        - Data corruption
        
        Immediate actions:
        1. Check Error Reporting console for error details
        2. Review service health dashboards
        3. Check recent deployments and changes
        4. Verify infrastructure status
        5. Consider activating incident response
      mimeType: "text/markdown"
    conditions:
      - displayName: "Critical error rate"
        conditionThreshold:
          filter: |
            resource.type="k8s_container"
            (
              resource.labels.container_name=~"fleetingdns-.*"
            )
            severity >= "ERROR"
          comparison: "COMPARISON_GREATER_THAN"
          thresholdValue: 100  # 100 errors in 5 minutes
          duration: "300s"
          aggregations:
            - alignmentPeriod: "60s"
              perSeriesAligner: "ALIGN_RATE"
              crossSeriesReducer: "REDUCE_SUM"
              groupByFields:
                - "resource.labels.container_name"
                - "resource.labels.cluster_name"
    alertStrategy:
      autoClose: "3600s"  # 1 hour
    combiner: "OR"
    enabled: true
    notificationChannels:
      - "projects/fleetingdns-analytics/notificationChannels/critical-errors-pager"
      - "projects/fleetingdns-analytics/notificationChannels/engineering-lead-email"
      - "projects/fleetingdns-analytics/notificationChannels/sre-team-slack"
  providerConfigRef:
    name: gcp-provider-config-analytics 