apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetingdns-trace-config
  labels:
    app.kubernetes.io/name: fleetingdns-trace-config
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fleetingdns-infrastructure
data:
  trace-config.yaml: |
    # Cloud Trace configuration for FleetingDNS services
    project_id: "fleetingdns-analytics"
    
    # Sampling configuration
    sampling:
      # Production sampling rate (0.1% to manage costs)
      production_rate: 0.001
      # Staging sampling rate (1% for better debugging)
      staging_rate: 0.01
      # Development sampling rate (10% for full visibility)
      development_rate: 0.1
      
      # Force sampling for critical operations
      force_sample_operations:
        - "dns_query_resolution"
        - "api_authentication"
        - "tunnel_establishment"
        - "threat_detection"
        - "certificate_validation"
      
      # Never sample these operations (too frequent)
      never_sample_operations:
        - "health_check"
        - "metrics_collection"
        - "log_shipping"
    
    # Service-specific tracing configuration
    services:
      fleetingdns-api:
        enabled: true
        sampling_rate: 0.01  # 1% for API calls
        custom_attributes:
          - "user_id"
          - "api_key_id"
          - "request_size"
          - "response_size"
          - "auth_method"
        span_processors:
          - "attribute_processor"
          - "resource_processor"
          - "batch_processor"
      
      fleetingdns-dnsd:
        enabled: true
        sampling_rate: 0.001  # 0.1% for DNS queries (high volume)
        custom_attributes:
          - "query_type"
          - "query_domain"
          - "client_ip"
          - "response_code"
          - "cache_hit"
        span_processors:
          - "dns_processor"
          - "batch_processor"
      
      fleetingdns-edgehub:
        enabled: true
        sampling_rate: 0.01  # 1% for tunnel operations
        custom_attributes:
          - "tunnel_id"
          - "client_id"
          - "tunnel_type"
          - "bytes_transferred"
          - "connection_duration"
        span_processors:
          - "tunnel_processor"
          - "batch_processor"
      
      fleetingdns-feed-grpc:
        enabled: true
        sampling_rate: 0.005  # 0.5% for feed operations
        custom_attributes:
          - "feed_type"
          - "subscriber_count"
          - "message_size"
          - "delivery_latency"
        span_processors:
          - "grpc_processor"
          - "batch_processor"
      
      fleetingdns-ml-scorer:
        enabled: true
        sampling_rate: 0.02  # 2% for ML operations
        custom_attributes:
          - "model_version"
          - "input_features"
          - "prediction_confidence"
          - "processing_time"
        span_processors:
          - "ml_processor"
          - "batch_processor"
    
    # Export configuration
    exporters:
      google_cloud_trace:
        project: "fleetingdns-analytics"
        endpoint: "cloudtrace.googleapis.com:443"
        use_insecure: false
        timeout: "30s"
        retry_on_failure:
          enabled: true
          initial_interval: "5s"
          max_interval: "30s"
          max_elapsed_time: "300s"
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
      
      # Additional export to BigQuery for long-term analysis
      bigquery:
        project: "fleetingdns-analytics"
        dataset: "distributed_traces"
        table: "trace_spans"
        timeout: "30s"
    
    # Resource detection
    resource_detection:
      detectors:
        - "gcp"
        - "k8s"
        - "docker"
      timeout: "10s"
    
    # Processors
    processors:
      batch:
        timeout: "1s"
        send_batch_size: 1024
        send_batch_max_size: 2048
      
      attributes:
        actions:
          - key: "environment"
            action: "insert"
            from_attribute: "k8s.namespace.name"
          - key: "service_version"
            action: "insert"
            from_attribute: "k8s.deployment.name"
          - key: "cluster_name"
            action: "insert"
            from_attribute: "k8s.cluster.name"
      
      resource:
        attributes:
          - key: "cloud.provider"
            value: "gcp"
            action: "insert"
          - key: "cloud.platform"
            value: "gcp_kubernetes_engine"
            action: "insert"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetingdns-otel-collector-config
  labels:
    app.kubernetes.io/name: fleetingdns-otel-collector-config
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: fleetingdns-infrastructure
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_http:
            endpoint: 0.0.0.0:14268
          thrift_compact:
            endpoint: 0.0.0.0:6831
          thrift_binary:
            endpoint: 0.0.0.0:6832
      
      zipkin:
        endpoint: 0.0.0.0:9411
    
    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
        send_batch_max_size: 2048
      
      memory_limiter:
        limit_mib: 512
        spike_limit_mib: 128
        check_interval: 5s
      
      resource:
        attributes:
          - key: service.name
            from_attribute: k8s.deployment.name
            action: insert
          - key: service.version
            from_attribute: k8s.pod.annotation.version
            action: insert
          - key: k8s.cluster.name
            action: insert
            value: ${K8S_CLUSTER_NAME}
      
      attributes:
        actions:
          - key: fleetingdns.environment
            from_attribute: k8s.namespace.name
            action: insert
          - key: fleetingdns.region
            from_attribute: cloud.region
            action: insert
    
    exporters:
      googlecloud:
        project: fleetingdns-analytics
        endpoint: cloudtrace.googleapis.com:443
        use_insecure: false
        timeout: 30s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
      
      logging:
        loglevel: info
      
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "fleetingdns_tracing"
        const_labels:
          environment: ${ENVIRONMENT}
          cluster: ${K8S_CLUSTER_NAME}
    
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      
      pprof:
        endpoint: 0.0.0.0:1777
      
      zpages:
        endpoint: 0.0.0.0:55679
    
    service:
      extensions: [health_check, pprof, zpages]
      pipelines:
        traces:
          receivers: [otlp, jaeger, zipkin]
          processors: [memory_limiter, resource, attributes, batch]
          exporters: [googlecloud, logging]
        
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, attributes, batch]
          exporters: [prometheus, logging]
      
      telemetry:
        logs:
          level: "info"
        metrics:
          address: 0.0.0.0:8888 