# FleetingDNS Infrastructure Project
apiVersion: cloudresourcemanager.gcp.upbound.io/v1beta1
kind: Project
metadata:
  name: fleetingdns-infra-project
  labels:
    app.kubernetes.io/name: fleetingdns-infra
    app.kubernetes.io/component: infrastructure
    app.kubernetes.io/part-of: fleetingdns-infrastructure
    fleetingdns.com/environment: infrastructure
spec:
  forProvider:
    projectId: fleetingdns-infra
    name: "FleetingDNS Infrastructure"
    billingAccount: "0197D9-AD23AA-0EFFBF"  # Replace with actual billing account
    parent: "folders/fleetingdns-folder"  # Reference to folder created earlier
    labels:
      environment: "infrastructure"
      team: "platform"
      cost-center: "infrastructure"
      security-zone: "control-plane"
  providerConfigRef:
    name: gcp-provider-config
---
