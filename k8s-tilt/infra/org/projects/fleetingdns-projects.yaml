# FleetingDNS Infrastructure Project
apiVersion: fleetingdns.io/v1alpha1
kind: XProject
metadata:
  name: fleetingdns-infra
  labels:
    app.kubernetes.io/name: fleetingdns-infra
    app.kubernetes.io/component: infrastructure
    app.kubernetes.io/part-of: fleetingdns
spec:
  parameters:
    projectId: fleetingdns-infra
    projectName: "FleetingDNS Infrastructure"
    billingAccount: "0197D9-AD23AA-0EFFBF"  # Replace with actual billing account
    organizationId: "123456789012"  # Replace with actual organization ID
    folderId: "folders/987654321098"  # Replace with actual folder ID
    environment: prod
    region: europe-west1
    labels:
      environment: infrastructure
      team: platform
      cost-center: infrastructure
      security-zone: control-plane
---
