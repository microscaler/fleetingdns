# Database Credentials
apiVersion: secretmanager.gcp.upbound.io/v1beta1
kind: Secret
metadata:
  name: fleetingdns-db-credentials
  labels:
    app.kubernetes.io/name: fleetingdns-db-credentials
    app.kubernetes.io/component: secret-manager
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    secretId: fleetingdns-db-credentials
    project: fleetingdns-infra
    replication:
    - auto: {}
    labels:
      environment: production
      type: database-credentials
      managed-by: crossplane
  providerConfigRef:
    name: default
---
apiVersion: secretmanager.gcp.upbound.io/v1beta1
kind: SecretVersion
metadata:
  name: fleetingdns-db-credentials-v1
  labels:
    app.kubernetes.io/name: fleetingdns-db-credentials-v1
    app.kubernetes.io/component: secret-manager
    app.kubernetes.io/part-of: fleetingdns
spec:
  forProvider:
    secret: fleetingdns-db-credentials
    secretData: |
      {
        "username": "fleetingdns_user",
        "password": "CHANGE_ME_SECURE_PASSWORD",
        "host": "fleetingdns-postgres.europe-west1.gcp.cloud.sql.proxy",
        "port": "5432",
        "database": "fleetingdns"
      }
  providerConfigRef:
    name: default
---
