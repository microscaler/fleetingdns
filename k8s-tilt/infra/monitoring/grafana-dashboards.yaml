apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetingdns-grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  fleetingdns-overview.json: |
    {
      "dashboard": {
        "id": null,
        "title": "FleetingDNS Overview",
        "tags": ["fleetingdns", "otlp", "observability"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "DNS Query Rate",
            "type": "stat",
            "targets": [
              {
                "expr": "rate(dns_queries_total[5m])",
                "legendFormat": "{{protocol}} - {{status}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "reqps"
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Edge Tunnels Active",
            "type": "stat",
            "targets": [
              {
                "expr": "edge_tunnels_open",
                "legendFormat": "Active Tunnels"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short"
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Certificate Operations",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(certificate_operations_total[5m])",
                "legendFormat": "{{operation}} - {{status}}"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "DNS Query Success Rate",
            "type": "stat",
            "targets": [
              {
                "expr": "rate(dns_queries_total{status=\"success\"}[5m]) / rate(dns_queries_total[5m]) * 100",
                "legendFormat": "Success Rate"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 0},
                    {"color": "yellow", "value": 95},
                    {"color": "green", "value": 99}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 8, "x": 0, "y": 16}
          },
          {
            "id": 5,
            "title": "DoT Connection Rate",
            "type": "stat",
            "targets": [
              {
                "expr": "rate(dot_connections_total[5m])",
                "legendFormat": "{{status}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "reqps"
              }
            },
            "gridPos": {"h": 8, "w": 8, "x": 8, "y": 16}
          },
          {
            "id": 6,
            "title": "Certificate Authority Health",
            "type": "stat",
            "targets": [
              {
                "expr": "rate(certificate_operations_total{operation=\"issue\",status=\"success\"}[5m]) / rate(certificate_operations_total{operation=\"issue\"}[5m]) * 100",
                "legendFormat": "Issuance Success Rate"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 0},
                    {"color": "yellow", "value": 90},
                    {"color": "green", "value": 95}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 8, "x": 16, "y": 16}
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "30s"
      }
    }
  
  fleetingdns-dns.json: |
    {
      "dashboard": {
        "id": null,
        "title": "FleetingDNS DNS Service",
        "tags": ["fleetingdns", "dns", "dnsd"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "DNS Query Volume by Protocol",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(dns_queries_total[5m])",
                "legendFormat": "{{protocol}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "DNS Query Status Distribution",
            "type": "piechart",
            "targets": [
              {
                "expr": "sum by (status) (rate(dns_queries_total[5m]))",
                "legendFormat": "{{status}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "DNS-over-TLS Connections",
            "type": "graph",
            "targets": [
              {
                "expr": "dot_active_connections",
                "legendFormat": "Active Connections"
              },
              {
                "expr": "rate(dot_connections_total[5m])",
                "legendFormat": "Connection Rate"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "DoT TLS Handshake Performance",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(dot_tls_handshake_duration_seconds_bucket[5m]))",
                "legendFormat": "95th percentile"
              },
              {
                "expr": "histogram_quantile(0.50, rate(dot_tls_handshake_duration_seconds_bucket[5m]))",
                "legendFormat": "50th percentile"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
          },
          {
            "id": 5,
            "title": "DNS Query Response Times",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(dot_query_duration_seconds_bucket[5m]))",
                "legendFormat": "95th percentile"
              },
              {
                "expr": "histogram_quantile(0.50, rate(dot_query_duration_seconds_bucket[5m]))",
                "legendFormat": "50th percentile"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "30s"
      }
    }
  
  fleetingdns-edgehub.json: |
    {
      "dashboard": {
        "id": null,
        "title": "FleetingDNS EdgeHub Service",
        "tags": ["fleetingdns", "edgehub", "tunnels"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Active Tunnels",
            "type": "stat",
            "targets": [
              {
                "expr": "edge_tunnels_open",
                "legendFormat": "Active Tunnels"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "color": {"mode": "thresholds"},
                "thresholds": {
                  "steps": [
                    {"color": "green", "value": 0},
                    {"color": "yellow", "value": 100},
                    {"color": "red", "value": 1000}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Tunnel Connection Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(edge_tunnels_open[5m])",
                "legendFormat": "Tunnel Connections/sec"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "SSH Connection Health",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(dot_connections_total{status=\"established\"}[5m])",
                "legendFormat": "Successful Connections"
              },
              {
                "expr": "rate(dot_connections_rejected_total[5m])",
                "legendFormat": "Rejected Connections"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8}
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "30s"
      }
    }
  
  fleetingdns-certificates.json: |
    {
      "dashboard": {
        "id": null,
        "title": "FleetingDNS Certificate Authority",
        "tags": ["fleetingdns", "certificates", "ca"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Certificate Operations Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(certificate_operations_total[5m])",
                "legendFormat": "{{operation}} - {{status}}"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Certificate Issuance Success Rate",
            "type": "stat",
            "targets": [
              {
                "expr": "rate(certificate_operations_total{operation=\"issue\",status=\"success\"}[5m]) / rate(certificate_operations_total{operation=\"issue\"}[5m]) * 100",
                "legendFormat": "Success Rate"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 0},
                    {"color": "yellow", "value": 95},
                    {"color": "green", "value": 99}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 8, "x": 0, "y": 8}
          },
          {
            "id": 3,
            "title": "Certificate Validation Rate",
            "type": "stat",
            "targets": [
              {
                "expr": "rate(certificate_operations_total{operation=\"validate\",status=\"success\"}[5m]) / rate(certificate_operations_total{operation=\"validate\"}[5m]) * 100",
                "legendFormat": "Validation Success Rate"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 0},
                    {"color": "yellow", "value": 90},
                    {"color": "green", "value": 95}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 8, "x": 8, "y": 8}
          },
          {
            "id": 4,
            "title": "Certificate Revocations",
            "type": "stat",
            "targets": [
              {
                "expr": "rate(certificate_operations_total{operation=\"revoke\",status=\"success\"}[5m])",
                "legendFormat": "Revocations/sec"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "reqps"
              }
            },
            "gridPos": {"h": 8, "w": 8, "x": 16, "y": 8}
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "30s"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetingdns-alerting-rules
  namespace: monitoring
  labels:
    prometheus_rule: "1"
data:
  fleetingdns-alerts.yml: |
    groups:
    - name: fleetingdns.rules
      rules:
      - alert: DNSHighErrorRate
        expr: rate(dns_queries_total{status!="success"}[5m]) / rate(dns_queries_total[5m]) * 100 > 5
        for: 2m
        labels:
          severity: warning
          service: dnsd
        annotations:
          summary: "High DNS error rate detected"
          description: "DNS error rate is {{ $value }}% over the last 5 minutes"
      
      - alert: DNSServiceDown
        expr: up{job="dnsd"} == 0
        for: 1m
        labels:
          severity: critical
          service: dnsd
        annotations:
          summary: "DNS service is down"
          description: "DNS service has been down for more than 1 minute"
      
      - alert: CertificateIssuanceFailure
        expr: rate(certificate_operations_total{operation="issue",status!="success"}[5m]) / rate(certificate_operations_total{operation="issue"}[5m]) * 100 > 10
        for: 5m
        labels:
          severity: warning
          service: edf-ca
        annotations:
          summary: "High certificate issuance failure rate"
          description: "Certificate issuance failure rate is {{ $value }}% over the last 5 minutes"
      
      - alert: EdgeHubTunnelOverload
        expr: edge_tunnels_open > 1000
        for: 5m
        labels:
          severity: warning
          service: edgehub
        annotations:
          summary: "High number of active tunnels"
          description: "EdgeHub has {{ $value }} active tunnels, approaching capacity"
      
      - alert: DoTConnectionRejectionHigh
        expr: rate(dot_connections_rejected_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          service: dnsd
        annotations:
          summary: "High DoT connection rejection rate"
          description: "DoT connections are being rejected at {{ $value }}/sec"
      
      - alert: CertificateAuthorityDown
        expr: up{job="edf-ca"} == 0
        for: 1m
        labels:
          severity: critical
          service: edf-ca
        annotations:
          summary: "Certificate Authority is down"
          description: "Certificate Authority service has been down for more than 1 minute" 