apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetingdns-prometheus-alerts
  namespace: monitoring
  labels:
    prometheus_rule: "1"
data:
  fleetingdns-alerts.yml: |
    groups:
    - name: fleetingdns.dns
      rules:
      - alert: DNSHighErrorRate
        expr: rate(dns_queries_total{status="error"}[5m]) / rate(dns_queries_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High DNS error rate detected"
          description: "DNS error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      - alert: DNSServiceDown
        expr: up{job="dnsd"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DNS service is down"
          description: "DNS service instance {{ $labels.instance }} has been down for more than 1 minute"

    - name: fleetingdns.certificates
      rules:
      - alert: CertificateIssuanceFailure
        expr: rate(certificate_operations_total{operation="issue",status="error"}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High certificate issuance failure rate"
          description: "Certificate issuance error rate is {{ $value }} operations/sec over the last 5 minutes"

      - alert: CertificateAuthorityDown
        expr: up{job="edf-ca"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Certificate Authority service is down"
          description: "Certificate Authority service instance {{ $labels.instance }} has been down for more than 1 minute"

    - name: fleetingdns.edgehub
      rules:
      - alert: EdgeHubTunnelOverload
        expr: edge_tunnels_open > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of active tunnels"
          description: "EdgeHub has {{ $value }} active tunnels, approaching capacity limits"

      - alert: DoTConnectionRejectionHigh
        expr: rate(dot_connections_rejected_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High DoT connection rejection rate"
          description: "DoT connection rejection rate is {{ $value }} connections/sec, reason: {{ $labels.reason }}"

    - name: fleetingdns.rate_limiting
      rules:
      - alert: RateLimitingHighRejectionRate
        expr: rate(rate_limit_checks_total{status="rejected"}[5m]) / rate(rate_limit_checks_total[5m]) > 0.2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High rate limiting rejection rate"
          description: "Rate limiting rejection rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      - alert: RateLimitingSystemOverload
        expr: rate(rate_limit_checks_total[5m]) > 1000
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Rate limiting system overload"
          description: "Rate limiting system is processing {{ $value }} checks/sec, indicating potential overload"

      - alert: UserTierImbalance
        expr: user_tier_distribution{tier="free"} / on() group_left() sum(user_tier_distribution) > 0.95
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "High proportion of free tier users"
          description: "{{ $value | humanizePercentage }} of users are on free tier, consider promotional campaigns for upgrades"

    - name: fleetingdns.ddos_protection
      rules:
      - alert: DDoSAttackDetected
        expr: rate(ddos_protection_blocks_total[1m]) > 50
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Potential DDoS attack detected"
          description: "DDoS protection is blocking {{ $value }} IPs/sec, indicating a potential attack"

      - alert: DDoSProtectionHighActivity
        expr: rate(ddos_protection_blocks_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High DDoS protection activity"
          description: "DDoS protection blocking rate is {{ $value }} IPs/sec over the last 5 minutes"

      - alert: OversizedRequestsHigh
        expr: rate(ddos_protection_oversized_requests_total[5m]) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High rate of oversized requests"
          description: "Receiving {{ $value }} oversized requests/sec, potential attack or misconfiguration"

      - alert: DDoSProtectionMemoryUsage
        expr: ddos_protection_tracked_ips > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DDoS protection tracking many IPs"
          description: "DDoS protection is tracking {{ $value }} IP addresses, consider cleanup"

    - name: fleetingdns.api
      rules:
      - alert: APIHighErrorRate
        expr: rate(api_requests_total{status=~"4..|5.."}[5m]) / rate(api_requests_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate"
          description: "API error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      - alert: APIServiceDown
        expr: up{job="backendapi"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API service is down"
          description: "API service instance {{ $labels.instance }} has been down for more than 1 minute"

      - alert: TunnelCreationFailureHigh
        expr: rate(tunnel_operations_total{operation="create",status="error"}[5m]) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High tunnel creation failure rate"
          description: "Tunnel creation failure rate is {{ $value }} operations/sec over the last 5 minutes"

      - alert: UserQuotaExhaustion
        expr: user_quota_exhausted_total > 0
        for: 0s
        labels:
          severity: info
        annotations:
          summary: "Users hitting quota limits"
          description: "{{ $value }} users have exhausted their quotas, consider upgrade prompts"

    - name: fleetingdns.performance
      rules:
      - alert: DNSResponseTimeHigh
        expr: histogram_quantile(0.95, rate(dns_query_duration_seconds_bucket[5m])) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High DNS response time"
          description: "95th percentile DNS response time is {{ $value }}s"

      - alert: TunnelEstablishmentSlow
        expr: histogram_quantile(0.95, rate(tunnel_establishment_duration_seconds_bucket[5m])) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Slow tunnel establishment"
          description: "95th percentile tunnel establishment time is {{ $value }}s"

      - alert: CertificateOperationSlow
        expr: histogram_quantile(0.95, rate(certificate_operation_duration_seconds_bucket[5m])) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Slow certificate operations"
          description: "95th percentile certificate operation time is {{ $value }}s" 