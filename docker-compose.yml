

x-rust-build: &rust-build
  context: .

services:
  dnsd:
    build:
      <<: *rust-build
      dockerfile: docker/Dockerfile.dnsd
    image: fleetingdns/dnsd:dev
    command: ["--addr", "0.0.0.0:6353"]
    ports: ["6353:6353/udp"]
    environment:
      - REDIS_URL=redis://redis:6379
      - DNS_BIND_ADDR=0.0.0.0
      - DNS_PORT=6353
      - DNS_ENABLE_DNSSEC=true
      - DNS_ENABLE_DDOS_PROTECTION=true
      - DNS_CACHE_TTL=300
      - DNS_MAX_CACHE_SIZE=5000
      - RUST_LOG=info
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - SERVICE_NAME=dnsd
      - SERVICE_VERSION=0.1.0
      - ENVIRONMENT=development
      - TELEMETRY_TRACING_ENABLED=true
      - TELEMETRY_METRICS_ENABLED=true
      - TELEMETRY_LOGGING_ENABLED=true
    depends_on: [redis, otel-collector]

  edgehub:
    build:
      <<: *rust-build
      dockerfile: docker/Dockerfile.edgehub
    image: fleetingdns/edgehub:dev
    command: ["--ssh-addr", "0.0.0.0:2222", "--addr", "0.0.0.0:8443"]
    ports: ["2222:2222", "8443:8443", "443:443"]
    environment:
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=info
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - SERVICE_NAME=edgehub
      - SERVICE_VERSION=0.1.0
      - ENVIRONMENT=development
      - TELEMETRY_TRACING_ENABLED=true
      - TELEMETRY_METRICS_ENABLED=true
      - TELEMETRY_LOGGING_ENABLED=true
    depends_on: [dnsd, otel-collector]

  intake_collector:
    build:
      <<: *rust-build
      dockerfile: docker/Dockerfile.intake_collector
    image: fleetingdns/intake_collector:dev
    command: []
    depends_on: [otel-collector]

  ml_scorer:
    build:
      <<: *rust-build
      dockerfile: docker/Dockerfile.ml_scorer
    image: fleetingdns/ml_scorer:dev
    command: []
    depends_on: [otel-collector]

  feed_grpc:
    build:
      <<: *rust-build
      dockerfile: docker/Dockerfile.feed_grpc
    image: fleetingdns/feed_grpc:dev
    command: []
    depends_on: [otel-collector]

  feed_webhook:
    build:
      <<: *rust-build
      dockerfile: docker/Dockerfile.feed_webhook
    image: fleetingdns/feed_webhook:dev
    command: []
    depends_on: [otel-collector]

  api:
    build:
      <<: *rust-build
      dockerfile: docker/Dockerfile.api
    image: fleetingdns/api:dev
    command: []
    ports: ["8880:8880"]
    environment:
      # DATABASE_URL is the SOPS-decrypted secret loaded by the octopilot
      # sops-decrypt action (or a local `.env`). Dev default keeps
      # `docker compose up` working without secrets.
      - DATABASE_URL=${DATABASE_URL:-postgresql://fdns:fdns@postgres:5432/fdns}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RUST_LOG=info
      - API_BIND_ADDRESS=0.0.0.0:8880
      - DEVELOPMENT_MODE=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - SERVICE_NAME=api
      - SERVICE_VERSION=0.1.0
      - ENVIRONMENT=development
      - TELEMETRY_TRACING_ENABLED=true
      - TELEMETRY_METRICS_ENABLED=true
      - TELEMETRY_LOGGING_ENABLED=true
    depends_on: [postgres, redis, otel-collector]

  test-service:
    build:
      <<: *rust-build
      dockerfile: docker/Dockerfile.test-service
    image: fleetingdns/test-service:dev
    command: []
    ports: ["8001:8001"]
    environment:
      - RUST_LOG=info
      - SERVICE_BIND_ADDRESS=0.0.0.0:8001
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - SERVICE_NAME=test-service
      - SERVICE_VERSION=0.1.0
      - ENVIRONMENT=development
      - TELEMETRY_TRACING_ENABLED=true
      - TELEMETRY_METRICS_ENABLED=true
      - TELEMETRY_LOGGING_ENABLED=true
    depends_on: [otel-collector]

  dig-test:
    build:
      dockerfile: docker/Dockerfile.dig-test
    image: fleetingdns/dig-test:dev
    command: []
    ports: []
    environment: []
    depends_on: [dnsd, test-service]
    volumes:
      - ./scripts:/scripts:ro

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]

  postgres:
    image: postgres:15-alpine
    # Credentials come from environment variables loaded by the octopilot
    # sops-decrypt action (FDNS_DB_PASSWORD is the secret; user/db name are
    # non-secret config). Dev defaults keep local `docker compose up` working.
    environment:
      POSTGRES_USER: ${FDNS_DB_USER:-fdns}
      POSTGRES_PASSWORD: ${FDNS_DB_PASSWORD:-fdns}
      POSTGRES_DB: ${FDNS_DB_NAME:-fdns}
    volumes: ["pgdata:/var/lib/postgresql/data"]

  mimir:
    image: grafana/mimir:2.10.2
    command: ["-config.file=/etc/mimir.yaml"]
    volumes: ["./docker/mimir-local.yaml:/etc/mimir.yaml:ro"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.93.0
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--enable-feature=memory-snapshot-on-shutdown"
    ports: ["9090:9090"]

  loki:
    image: grafana/loki:2.9.3
    command: ["-config.file=/etc/loki-config.yaml"]
    volumes:
      - ./docker/loki-config.yaml:/etc/loki-config.yaml:ro
    ports: ["3100:3100"]

  promtail:
    image: grafana/promtail:2.9.3
    command: ["-config.file=/etc/promtail-config.yaml"]
    volumes:
      - ./docker/promtail-config.yaml:/etc/promtail-config.yaml:ro
      - /var/log:/var/log:ro

  grafana:
    image: grafana/grafana:10.3.1
    volumes:
      - ./docker/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SERVER_HTTP_PORT=3000
    ports: ["3000:3000"]
    depends_on: [prometheus, loki, mimir]

volumes:
  pgdata:

networks:
  default:
    driver: bridge
