apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fleetingdns
configMapGenerator:
  - name: database-config
    envs:
      - application.properties
secretGenerator:
  - name: db-credentials
    envs:
      - application.secrets.env
generatorOptions:
  disableNameSuffixHash: true
  immutable: false
