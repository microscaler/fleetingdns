# Non-secret FleetingDNS dev runtime configuration.
# FDNS_-namespaced to match the secret keys (application.secrets.env); together
# the two files are the env contract consumed by docker compose and k8s.
FDNS_DB_HOST=postgres.data.svc.cluster.local
FDNS_DB_PORT=5432
FDNS_DB_NAME=fdns
FDNS_DB_USER=fdns
REDIS_URL=redis://redis:6379
