apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
resources:
  - database-job.yaml
configMapGenerator:
  - name: fleetingdns-bootstrap-config
    envs:
      - application.properties
secretGenerator:
  - name: fleetingdns-bootstrap-db
    envs:
      - application.secrets.env
generatorOptions:
  disableNameSuffixHash: true
  immutable: false
