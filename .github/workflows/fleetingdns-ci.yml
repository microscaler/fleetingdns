name: FleetingDNS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  # Job 1: Rust Unit Tests and Code Quality
  rust-tests:
    name: Rust Unit Tests & Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [nightly]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
          override: true
          
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Install kdig
        run: sudo apt-get update && sudo apt-get install -y knot-dnsutils
        
      - name: Format check
        run: cargo fmt -- --check
        
      - name: Lint check
        run: cargo clippy --all -- -D warnings
        
      - name: Unit tests
        run: cargo test --workspace --lib --bins
        env:
          RUST_TEST_THREADS: 1
          
      - name: DoT tests
        run: cargo test -p dnsd --features dot
          
      - name: Smoke test dnsd binary
        run: |
          cargo run --bin dnsd-bin &
          DNSD_PID=$!
          sleep 2
          dig @127.0.0.1 -p 53 example.com || true
          kill $DNSD_PID

  # Job 2: Integration Tests with Testcontainers
  integration-tests:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [nightly]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
          override: true
          
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Pull Redis Docker image
        run: |
          docker pull redis:7-alpine
          docker images | grep redis
          
      - name: Test Docker availability
        run: |
          docker --version
          docker info
          docker ps
          
      - name: Run testcontainer tests
        run: cargo test --workspace
        env:
          # Testcontainers configuration for CI
          TESTCONTAINERS_RYUK_DISABLED: true
          TESTCONTAINERS_COMMAND_TIMEOUT: 180
          DOCKER_HOST: unix:///var/run/docker.sock
          # Run tests serially to avoid Docker resource conflicts
          RUST_TEST_THREADS: 1
          # Increase test timeout for container startup
          RUST_TEST_TIME_UNIT: 180s
          # Disable container logs to reduce noise
          TESTCONTAINERS_LOG_LEVEL: OFF
          # Enable debug logging for testcontainers if needed
          RUST_LOG: testcontainers=debug
          
      - name: Run specific Redis cache tests
        run: cargo test -p dnsd redis_cache::tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
          TESTCONTAINERS_COMMAND_TIMEOUT: 180
          DOCKER_HOST: unix:///var/run/docker.sock
          RUST_TEST_THREADS: 1
          RUST_TEST_TIME_UNIT: 180s
          
      - name: Run specific slot-setter tests
        run: cargo test -p slot-setter
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
          TESTCONTAINERS_COMMAND_TIMEOUT: 180
          DOCKER_HOST: unix:///var/run/docker.sock
          RUST_TEST_THREADS: 1
          RUST_TEST_TIME_UNIT: 180s
          
      - name: Clean up Docker containers
        if: always()
        run: |
          echo "Cleaning up Docker containers..."
          docker ps -a
          docker container prune -f || true

  # Job 3: DNS Integration Testing
  dns-integration:
    name: DNS Integration Testing
    runs-on: ubuntu-latest
    needs: [rust-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dnsutils jq bc python3 python3-pip
          pip3 install dnspython requests
          
      - name: Build and start services
        run: |
          docker compose up -d --build
          echo "Waiting for services to start..."
          sleep 15
          
      - name: Verify services are running
        run: |
          echo "Checking service status..."
          docker compose ps
          
          # Wait for DNS service to be ready
          for i in {1..10}; do
            if docker compose exec dnsd dig @127.0.0.1 -p 6353 test.fdns.run +short | grep -q "127.0.0.1"; then
              echo "DNS service is ready"
              break
            fi
            echo "Waiting for DNS service... ($i/10)"
            sleep 5
          done
          
      - name: Run DNS integration tests
        run: |
          echo "Running DNS integration tests..."
          chmod +x scripts/test_dns_ci.sh
          ./scripts/test_dns_ci.sh
          
      - name: Run custom DNS client tests
        run: |
          echo "Running custom DNS client tests..."
          python3 scripts/dns_test_client.py test
          
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: dns-test-reports
          path: test-reports/
          
      - name: Grafana health check
        run: |
          echo "Checking Grafana health..."
          for i in {1..10}; do
            status=$(curl -s http://localhost:3000/api/health | jq -r '.database') || true
            if [ "$status" = "ok" ]; then
              echo "Grafana is healthy"
              break
            fi
            echo "Waiting for Grafana... ($i/10)"
            sleep 5
          done
          
      - name: Prometheus health check
        run: |
          echo "Checking Prometheus health..."
          curl -s http://localhost:9090/-/healthy || echo "Prometheus health check failed"
          
      - name: Check service metrics
        run: |
          echo "Checking service metrics..."
          curl -s http://localhost:8889/metrics | grep -E "(dns_|edge_|certificate_)" || echo "No FleetingDNS metrics found"
          
      - name: Teardown
        if: always()
        run: |
          echo "Cleaning up services..."
          docker compose down -v

  # Job 4: Docker Compose Smoke Tests
  compose-smoke:
    name: Docker Compose Smoke Tests
    runs-on: ubuntu-latest
    needs: [rust-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y dnsutils jq
        
      - name: Launch compose stack
        run: docker compose -f docker-compose.yml -f docker/docker-compose.ci.yml up -d --build
        
      - name: Wait for services
        run: |
          for i in {1..10}; do
            dig @127.0.0.1 -p6353 test.fdns.run +short | grep -q "127.0.0.1" && break
            sleep 5
          done
          dig @127.0.0.1 -p6353 test.fdns.run +short | grep "127.0.0.1"
          
      - name: Grafana health check
        run: |
          for i in {1..10}; do
            status=$(curl -s http://localhost:3000/api/health | jq -r '.database') || true
            if [ "$status" = "ok" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Grafana failed health check" >&2
          exit 1
          
      - name: Round-trip demo
        run: bash scripts/roundtrip_demo.sh
        continue-on-error: true
        
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker/docker-compose.ci.yml down 