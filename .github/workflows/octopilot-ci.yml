name: Octopilot CI

# The entire build + integration DAG (detect → lint → test → validate →
# artifacts → deploy) comes from the shared reusable pipeline in
# octopilot/actions. integration: true opts in to the generic Kind + Flux
# deploy, which discovers this repo's shape from its chart/, k8s/env/ci overlay,
# hack/ci-deps and deployment-configuration SOPS profile. This repo only adds
# its tag-time release jobs.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Flux image automation writes image refs into
    # deployment-configuration/profiles/ — ignoring it breaks the
    # build -> image commit -> build-cancelling-build feedback loop.
    paths-ignore:
      - 'deployment-configuration/profiles/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref: a new push cancels the previous in-flight run so builds
# never stack up. Tag runs are NEVER cancelled — releases always complete.
concurrency:
  group: octopilot-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ── Generic Octopilot pipeline (reusable; nested + branded in the graph) ────
  build:
    name: Octopilot
    uses: octopilot/actions/.github/workflows/pipeline.yml@main
    with:
      integration: true
      profile: dev
    # Pass explicitly (not `inherit`): inherit does not reliably cross the
    # org boundary to octopilot/actions. Maps to the workflow's declared secrets.
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # ── Release binaries (CLI tools → GitHub Release; tags only) ────────────────
  release-binaries:
    name: Release CLI Binaries
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI release binaries
        run: cargo build --release -p edf-cli -p fleetingdns-ctl -p slot-setter
      - name: Package binaries
        run: |
          set -e
          mkdir -p dist
          VER="${GITHUB_REF_NAME}"
          for bin in edf-cli fleetingdns-ctl slot-setter; do
            cp "target/release/${bin}" "dist/${bin}"
            tar -C target/release -czf "dist/${bin}-${VER}-x86_64-unknown-linux-gnu.tar.gz" "${bin}"
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist
      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt

  # ── Release notes (on tag: generate and publish to GitHub Release) ──────────
  release-notes:
    name: Release Notes
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find Previous Tag
        id: prev_tag
        uses: octopilot/actions/previous-tag@main
        with:
          fallback: "v0.0.0"
      - name: Generate Release Notes
        id: release_notes
        uses: octopilot/actions/release@main
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          version: ${{ github.ref_name }}
          since_tag: ${{ steps.prev_tag.outputs.tag }}
          provider: anthropic
      - name: Publish Release Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.body_file }}
