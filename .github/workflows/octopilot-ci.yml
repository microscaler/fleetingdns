name: Octopilot CI

# The generic build DAG (detect → lint → test → integration-validate →
# integration-artifacts) comes from the shared reusable pipeline in
# octopilot/actions — this repo only declares its app-specific deploy + release.
# Adopting the build DAG in a new repo is just the `build` job below.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Generic Octopilot build DAG (reusable; renders nested in the graph) ─────
  build:
    uses: octopilot/actions/.github/workflows/pipeline.yml@main
    secrets: inherit

  # ── Integration deploy (Kind + SOPS secret + ci-deps + Flux HelmRelease) ────
  # App-specific: consumes the integration-* artifacts the reusable build
  # uploaded (build_result.json) and stands the stack up in Kind.
  integration-deploy:
    name: Integration (deploy)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact outputs
        uses: actions/download-artifact@v4
        with:
          pattern: integration-*
          path: artifact-outputs

      - name: Merge build_result.json from all integration jobs
        uses: octopilot/actions/merge-build-results@main
        with:
          directory: artifact-outputs
          output-path: build_result.json

      - name: Resolve deploy image refs
        id: artifacts
        run: |
          set -e
          IMAGE_API="$(jq -r '.builds[] | select(.imageName | test("fleetingdns-api$")) | .tag' build_result.json 2>/dev/null | head -1)"
          IMAGE_DNSD="$(jq -r '.builds[] | select(.imageName | test("fleetingdns-dnsd$")) | .tag' build_result.json 2>/dev/null | head -1)"
          IMAGE_EDGEHUB="$(jq -r '.builds[] | select(.imageName | test("fleetingdns-edgehub$")) | .tag' build_result.json 2>/dev/null | head -1)"
          IMAGE_CHART="$(jq -r '.builds[] | select(.imageName | test("-chart$")) | .tag' build_result.json 2>/dev/null | head -1)"

          # Chart ref must be Helm OCI shape: registry/repo/chartname:version[@digest].
          CHART_NAME="$(grep -E '^name:' chart/fleetingdns/Chart.yaml 2>/dev/null | sed 's/^name:[[:space:]]*//;s/[[:space:]]*$//' || echo fleetingdns)"
          if ! echo "$IMAGE_CHART" | grep -qE "/${CHART_NAME}:"; then
            if echo "$IMAGE_CHART" | grep -qE -- '-chart:[^@]+'; then
              IMAGE_CHART="$(echo "$IMAGE_CHART" | sed "s|-chart:|-chart/${CHART_NAME}:|")"
              echo "Normalized chart ref to Helm OCI form: ${IMAGE_CHART}"
            else
              echo "::error::Chart ref missing chart name segment: expected .../${CHART_NAME}:version[@digest], got: ${IMAGE_CHART}"
              exit 1
            fi
          fi
          if echo "$IMAGE_CHART" | grep -q '@sha256:'; then
            CHART_REF="oci://$(echo "$IMAGE_CHART" | sed 's/:[^@]*@/@/')"
          else
            CHART_REF="oci://${IMAGE_CHART}"
          fi

          echo "api_image=${IMAGE_API}" >> "$GITHUB_OUTPUT"
          echo "dnsd_image=${IMAGE_DNSD}" >> "$GITHUB_OUTPUT"
          echo "edgehub_image=${IMAGE_EDGEHUB}" >> "$GITHUB_OUTPUT"
          echo "chart_ref=${CHART_REF}" >> "$GITHUB_OUTPUT"

          echo "=== build_result.json (merged) ==="
          jq . build_result.json
          echo "=== Resolved deploy outputs ==="
          echo "api=${IMAGE_API}"
          echo "dnsd=${IMAGE_DNSD}"
          echo "edgehub=${IMAGE_EDGEHUB}"
          echo "chart_ref=${CHART_REF}"
          if [ -z "$IMAGE_API" ] || [ -z "$IMAGE_DNSD" ] || [ -z "$IMAGE_EDGEHUB" ] || [ -z "$IMAGE_CHART" ]; then
            echo "::error::Missing builds: api=${IMAGE_API:+set} dnsd=${IMAGE_DNSD:+set} edgehub=${IMAGE_EDGEHUB:+set} chart=${IMAGE_CHART:+set}"
            jq -r '.builds[]? | "\(.imageName): \(.tag)"' build_result.json 2>/dev/null || true
            exit 1
          fi

      - name: Decrypt runtime DB secret (SOPS + age)
        id: sops
        uses: octopilot/actions/sops-decrypt@main
        with:
          file: deployment-configuration/profiles/dev/fleetingdns/core/runtime/application.secrets.env
          age_key: ${{ secrets.SOPS_AGE_KEY }}
          output_type: dotenv

      - name: Create Kind cluster (Kubernetes 1.34.3)
        uses: helm/kind-action@v1
        with:
          version: v0.31.0
          node_image: kindest/node:v1.34.3
          cluster_name: fleetingdns
          wait: 120s

      - name: Setup kubectl
        uses: octopilot/actions/setup-tools@main
        with:
          kubectl_version: "1.34.3"

      - name: Create namespace, DB secret and ephemeral deps (redis + postgres)
        env:
          SECRET_DOTENV: ${{ steps.sops.outputs.data }}
        run: |
          set -e
          kubectl create namespace fleetingdns --dry-run=client -o yaml | kubectl apply -f -
          # DB credentials Secret consumed by the api (keys: FDNS_DB_PASSWORD, DATABASE_URL)
          printf '%s\n' "$SECRET_DOTENV" > /tmp/db.env
          kubectl create secret generic fleetingdns-db-credentials \
            -n fleetingdns --from-env-file=/tmp/db.env \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/db.env
          kubectl apply -n fleetingdns -f hack/ci-deps/
          kubectl rollout status deploy/postgres -n fleetingdns --timeout=180s
          kubectl rollout status deploy/redis -n fleetingdns --timeout=120s

      - name: Setup Flux in Kind
        uses: octopilot/actions/setup-flux@main
        with:
          export_path: k8s/deployment/flux-system/gotk-components.yaml

      - name: Deploy fleetingdns via Flux (OCI chart + HelmRelease)
        env:
          CHART_REF: ${{ steps.artifacts.outputs.chart_ref }}
          API_IMAGE: ${{ steps.artifacts.outputs.api_image }}
          DNSD_IMAGE: ${{ steps.artifacts.outputs.dnsd_image }}
          EDGEHUB_IMAGE: ${{ steps.artifacts.outputs.edgehub_image }}
        run: |
          set -e
          RECONCILE_FAILED=0
          CHART_OCI_URL="$(echo "$CHART_REF" | sed 's|^oci://||' | cut -d'@' -f1)"
          CHART_DIGEST="$(echo "$CHART_REF" | sed 's|^oci://||' | cut -d'@' -f2)"
          export CHART_OCI_URL API_IMAGE DNSD_IMAGE EDGEHUB_IMAGE
          export CHART_REF_TYPE=digest
          export CHART_REF_VALUE="$CHART_DIGEST"
          kubectl kustomize k8s/env/ci | envsubst | kubectl apply -f -
          flux reconcile source oci fleetingdns-chart -n fleetingdns --timeout=2m || RECONCILE_FAILED=1
          # 8m covers the pre-install migration hook, the three Deployments
          # becoming ready, and the Helm test hook (spec.test.enable: true).
          flux reconcile helmrelease fleetingdns -n fleetingdns --timeout=8m || RECONCILE_FAILED=1
          kubectl get all -n fleetingdns
          flux get helmrelease -n fleetingdns
          if [ "$RECONCILE_FAILED" -ne 0 ]; then
            echo "::group::Flux controller logs and events (reconcile failed)"
            kubectl logs -n flux-system -l app=source-controller --tail=300 --all-containers=true 2>/dev/null || true
            kubectl logs -n flux-system -l app=helm-controller --tail=300 --all-containers=true 2>/dev/null || true
            kubectl get events -n fleetingdns --sort-by='.lastTimestamp' 2>/dev/null | tail -80 || true
            kubectl describe pods -n fleetingdns 2>/dev/null | tail -160 || true
            echo "=== migration hook Job logs ==="
            kubectl logs -n fleetingdns job/fleetingdns-migrate --tail=100 2>/dev/null || true
            echo "=== Helm test Pod logs ==="
            kubectl logs -n fleetingdns fleetingdns-api-smoke --tail=100 2>/dev/null || true
            echo "=== api/dnsd/edgehub pod logs ==="
            for app in api dnsd edgehub; do
              echo "--- $app ---"
              kubectl logs -n fleetingdns -l app=$app --tail=60 --all-containers=true 2>/dev/null || true
            done
            flux get source oci -n fleetingdns 2>/dev/null || true
            flux get helmrelease -n fleetingdns 2>/dev/null || true
            echo "::endgroup::"
            exit 1
          fi

  # ── Release binaries (CLI tools → GitHub Release; tags only) ────────────────
  release-binaries:
    name: Release CLI Binaries
    needs: [integration-deploy]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI release binaries
        run: cargo build --release -p edf-cli -p fleetingdns-ctl -p slot-setter
      - name: Package binaries
        run: |
          set -e
          mkdir -p dist
          VER="${GITHUB_REF_NAME}"
          for bin in edf-cli fleetingdns-ctl slot-setter; do
            cp "target/release/${bin}" "dist/${bin}"
            tar -C target/release -czf "dist/${bin}-${VER}-x86_64-unknown-linux-gnu.tar.gz" "${bin}"
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist
      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt

  # ── Release notes (on tag: generate and publish to GitHub Release) ──────────
  release-notes:
    name: Release Notes
    needs: [integration-deploy]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find Previous Tag
        id: prev_tag
        uses: octopilot/actions/previous-tag@main
        with:
          fallback: "v0.0.0"
      - name: Generate Release Notes
        id: release_notes
        uses: octopilot/actions/release@main
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          version: ${{ github.ref_name }}
          since_tag: ${{ steps.prev_tag.outputs.tag }}
          provider: anthropic
      - name: Publish Release Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.body_file }}
