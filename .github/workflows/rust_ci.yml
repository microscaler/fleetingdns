name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
          override: true
      - name: Format
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy --all -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Smoke test dnsd
        run: |
          cargo run --bin dnsdctl &
          DNSD_PID=$!
          sleep 2
          dig @127.0.0.1 -p 53 example.com || true
          kill $DNSD_PID
