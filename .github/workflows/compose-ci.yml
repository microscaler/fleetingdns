name: Compose CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y dnsutils jq
      # Use the root-level compose file with the CI overlay
      - name: Launch compose stack
        run: docker compose -f docker-compose.yml -f docker/docker-compose.ci.yml up -d --build
      - name: Wait for services
        run: |
          for i in {1..10}; do
            dig @127.0.0.1 -p5353 test.fdns.run +short | grep -q "127.0.0.1" && break
            sleep 5
          done
          dig @127.0.0.1 -p5353 test.fdns.run +short | grep "127.0.0.1"
      - name: Grafana health check
        run: |
          for i in {1..10}; do
            status=$(curl -s http://localhost:3000/api/health | jq -r '.database') || true
            if [ "$status" = "ok" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Grafana failed health check" >&2
          exit 1
      - name: Round-trip demo
        run: bash scripts/roundtrip_demo.sh
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker/docker-compose.ci.yml down
