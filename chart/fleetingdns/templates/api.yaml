apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ include "fleetingdns.namespace" . }}
  labels:
    app: api
    component: core
    {{- include "fleetingdns.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        component: core
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The buildpack image bundles every workspace binary and defaults its
          # "web" process to an unrelated stub, so select the api process type
          # explicitly via the CNB launcher.
          command: ["/cnb/process/api-bin"]
          ports:
            # 8880: 8080 is chronically contested on shared dev hosts; /health
            # and /metrics are served on 8880 too.
            - containerPort: {{ .Values.api.port }}
              protocol: TCP
              name: http
          env:
            # DATABASE_URL (with password) comes from the SOPS-generated Secret,
            # never inlined in the chart.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.urlSecret.name }}
                  key: {{ .Values.database.urlSecret.key }}
            - name: REDIS_URL
              value: {{ .Values.config.redisUrl | quote }}
            - name: RUST_LOG
              value: {{ .Values.config.rustLog | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.config.otelEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "api"
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          # /ready sits behind auth (401 without a token), so probe /health.
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ include "fleetingdns.namespace" . }}
  labels:
    app: api
    component: core
    {{- include "fleetingdns.commonLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      protocol: TCP
      name: http
  selector:
    app: api
