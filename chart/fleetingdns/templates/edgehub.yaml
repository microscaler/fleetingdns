apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgehub
  namespace: {{ include "fleetingdns.namespace" . }}
  labels:
    app: edgehub
    component: core
    {{- include "fleetingdns.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.edgehub.replicas }}
  selector:
    matchLabels:
      app: edgehub
  template:
    metadata:
      labels:
        app: edgehub
        component: core
    spec:
      containers:
        - name: edgehub
          image: {{ .Values.edgehub.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Select the edgehub process type; the buildpack image's default "web"
          # process points at an unrelated bundled binary.
          command: ["/cnb/process/edgehub-bin"]
          ports:
            - containerPort: {{ .Values.edgehub.sshPort }}
              protocol: TCP
              name: ssh
            - containerPort: {{ .Values.edgehub.httpsPort }}
              protocol: TCP
              name: https
          # --ssh-addr/--https-addr default to 0.0.0.0:2222 / :8443; only redis
          # needs overriding here.
          args:
            - "--redis"
            - {{ .Values.config.redisUrl | quote }}
          env:
            - name: RUST_LOG
              value: {{ .Values.config.rustLog | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.config.otelEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "edgehub"
          resources:
            {{- toYaml .Values.edgehub.resources | nindent 12 }}
          # edgehub binds 2222 (SSH reverse-tunnel) and 8443 (HTTPS router);
          # probe the SSH port the CLI connects out to.
          livenessProbe:
            tcpSocket:
              port: {{ .Values.edgehub.sshPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: {{ .Values.edgehub.sshPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: edgehub
  namespace: {{ include "fleetingdns.namespace" . }}
  labels:
    app: edgehub
    component: core
    {{- include "fleetingdns.commonLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.edgehub.sshPort }}
      targetPort: {{ .Values.edgehub.sshPort }}
      protocol: TCP
      name: ssh
    # Public HTTPS on 443 → container 8443 (non-root can't bind <1024).
    - port: 443
      targetPort: {{ .Values.edgehub.httpsPort }}
      protocol: TCP
      name: https
  selector:
    app: edgehub
