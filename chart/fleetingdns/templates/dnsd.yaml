apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnsd
  namespace: {{ include "fleetingdns.namespace" . }}
  labels:
    app: dnsd
    component: core
    {{- include "fleetingdns.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.dnsd.replicas }}
  selector:
    matchLabels:
      app: dnsd
  template:
    metadata:
      labels:
        app: dnsd
        component: core
    spec:
      containers:
        - name: dnsd
          image: {{ .Values.dnsd.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Select the dnsd process type; the buildpack image's default "web"
          # process points at an unrelated bundled binary.
          command: ["/cnb/process/dnsd-bin"]
          ports:
            - containerPort: {{ .Values.dnsd.port }}
              protocol: UDP
              name: dns-udp
          args:
            - "--addr"
            - "0.0.0.0:{{ .Values.dnsd.port }}"
          env:
            - name: REDIS_URL
              value: {{ .Values.config.redisUrl | quote }}
            - name: RUST_LOG
              value: {{ .Values.config.rustLog | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.config.otelEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "dnsd"
          resources:
            {{- toYaml .Values.dnsd.resources | nindent 12 }}
          # dnsd only binds UDP :53 (no HTTP listener) and k8s cannot probe UDP,
          # so verify the UDP socket exists in /proc (:0035 == port 53 hex).
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "grep -q ':0035' /proc/net/udp /proc/net/udp6"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "grep -q ':0035' /proc/net/udp /proc/net/udp6"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dnsd
  namespace: {{ include "fleetingdns.namespace" . }}
  labels:
    app: dnsd
    component: core
    {{- include "fleetingdns.commonLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.dnsd.port }}
      targetPort: {{ .Values.dnsd.port }}
      protocol: UDP
      name: dns-udp
  selector:
    app: dnsd
