[package]
name = "edf-cli"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Enable CLI endpoint override flags for development/testing
# Usage: cargo run --features dev-overrides -- --api-url http://localhost:8880 --hub-url localhost:2222
dev-overrides = []

[dependencies]
# Core dependencies
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"

# Common utilities
common = { path = "../../crates/common" }

# CLI and configuration
clap = { version = "4", features = ["derive"] }
config = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# SSH and TLS
russh = "0.60"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "1"

# HTTP client for API calls
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Time and utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
base64 = "0.22"

# SSH key generation
tempfile = "3.0"
dirs = "5.0"

[dev-dependencies]
rand_key = { package = "rand", version = "0.10", features = ["thread_rng"] }

[lints]
workspace = true
