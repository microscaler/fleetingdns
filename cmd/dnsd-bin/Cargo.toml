[package]
name = "dnsd-bin"
version = "0.1.0"
edition = "2024"

[dependencies]
dnsd = { path = "../../crates/dnsd" }
tokio = { workspace = true, features = ["full"] }
common = { path = "../../crates/common" }
tracing = { workspace = true }
clap = { version = "4.0", features = ["derive"] }

[features]
dot = ["dnsd/dot"]
