# Spot nodepool carrying Edge and ARC runners in asia-southeast1
# Should: e2-standard-4, autoscale 0→4, preemptible true
apiVersion: container.gcp.crossplane.io/v1alpha1
kind: NodePool
metadata:
  name: edge-spot-apac
spec:
  clusterRef:
    name: workload-apac
  config:
    machineType: e2-standard-4
    spot: true
  autoscaling:
    minNodeCount: 0
    maxNodeCount: 4
