# Octopilot shape source of truth (detect-contexts reads this).
#
# FleetingDNS is a multi-binary Cargo workspace. Only the CONTAINER services are
# listed here; the CLI tools (edf-cli, fleetingdns-ctl, slot-setter) are shipped
# as GitHub Release binaries by the workflow's `release-binaries` job, NOT as
# images — see docs/engineering/OCTOPILOT-PIPELINE-MIGRATION.md §2.
#
# Each service uses the octopilot/rust buildpack with BP_RUST_PACKAGE selecting
# the workspace member (context is the repo root, which carries Cargo.toml so
# detect-contexts classifies these as rust). The Helm chart is packaged as an
# OCI artifact for the Flux HelmRelease deploy path.
apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: fleetingdns
build:
  artifacts:
    # api image carries api-bin + the migration binary: the chart's helm
    # pre-install hook runs /cnb/process/migration from this image
    # (BP_RUST_PACKAGES multi-select, rust buildpack >= 0.1.11 — which also
    # names a process per binary, so /cnb/process/api-bin etc. resolve).
    # NOTE: requires a builder containing rust 0.1.11; bump ALL builder pins
    # in this file to that builder tag before pushing.
    - image: ghcr.io/microscaler/fleetingdns-api
      context: .
      buildpacks:
        builder: ghcr.io/octopilot/builder-jammy-base:rust-builder-ab65609
        buildpacks:
          - octopilot/rust
        env:
          - BP_RUST_PACKAGES=api-bin,migration
    - image: ghcr.io/microscaler/fleetingdns-dnsd
      context: .
      buildpacks:
        builder: ghcr.io/octopilot/builder-jammy-base:rust-builder-ab65609
        buildpacks:
          - octopilot/rust
        env:
          - BP_RUST_PACKAGE=dnsd-bin
          - BP_RUST_BINARY_NAME=dnsd-bin
    - image: ghcr.io/microscaler/fleetingdns-edgehub
      context: .
      buildpacks:
        builder: ghcr.io/octopilot/builder-jammy-base:rust-builder-ab65609
        buildpacks:
          - octopilot/rust
        env:
          - BP_RUST_PACKAGE=edgehub-bin
          - BP_RUST_BINARY_NAME=edgehub-bin
    # binary meta-build function (-bin suffix): the CLI tools shipped as
    # GitHub Release binaries. The pipeline's deliverables job release-builds
    # the declared packages every run and assembles dist/ (tarball +
    # SHA256SUMS); tag-gated GH-release publishing migrates here from the
    # hand-rolled release-binaries workflow job in a later phase.
    - image: ghcr.io/microscaler/fleetingdns-cli-bin
      context: .
      buildpacks:
        builder: ghcr.io/octopilot/builder-jammy-base:rust-builder-ab65609
        env:
          - BP_BIN_PACKAGES=edf-cli,fleetingdns-ctl,slot-setter
    - image: ghcr.io/microscaler/fleetingdns-chart
      context: chart/fleetingdns
      buildpacks:
        builder: ghcr.io/octopilot/builder-jammy-base:rust-builder-ab65609
