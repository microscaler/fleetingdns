# CI substitutes CHART_OCI_URL, CHART_REF_VALUE, API_IMAGE, DNSD_IMAGE, EDGEHUB_IMAGE before apply.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ocirepository.yaml
  - helmrelease.yaml
