# Helm release for fleetingdns. The three service image refs (API_IMAGE, DNSD_IMAGE,
# EDGEHUB_IMAGE) are substituted by the CI deploy job from the merged build_result.json.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fleetingdns
  namespace: fleetingdns
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: fleetingdns-chart
    namespace: fleetingdns
  releaseName: fleetingdns
  targetNamespace: fleetingdns
  # Run the chart's Helm test hooks (API smoke) as part of reconciliation so a
  # broken API fails the release.
  test:
    enable: true
  install:
    createNamespace: true
    # retries: 0 leaves a failed release (and its migration/test pods) in place
    # for diagnosis instead of uninstalling. Bump for production resilience.
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  values:
    namespace: fleetingdns
    image:
      pullPolicy: Always
    # Injected by the generic Octopilot integration deploy: IMG_<image-basename>
    # (ghcr.io/.../fleetingdns-api -> IMG_fleetingdns_api).
    api:
      image: ${IMG_fleetingdns_api}
    dnsd:
      image: ${IMG_fleetingdns_dnsd}
    edgehub:
      image: ${IMG_fleetingdns_edgehub}
