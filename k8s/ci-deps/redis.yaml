# Ephemeral Redis for the CI Kind smoke deploy only. Not part of the fleetingdns
# chart (production Redis is provisioned externally). Matches config.redisUrl
# (redis://redis:6379) from the chart values.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fleetingdns
  labels: { app: redis, tier: ci-deps }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis, tier: ci-deps }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fleetingdns
  labels: { app: redis, tier: ci-deps }
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
