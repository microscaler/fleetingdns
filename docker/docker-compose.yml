version: "3.9"

x-rust-build: &rust-build
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: runtime

services:
  dnsd:
    <<: *rust-build
    image: fleetingdns/dnsd:dev
    command: ["/app/dnsd-bin", "--addr", "0.0.0.0:53"]
    ports: ["5353:53/udp"]
    depends_on: [otel-collector]

  edgehub:
    <<: *rust-build
    image: fleetingdns/edgehub:dev
    command: ["/app/edgehub-bin"]
    depends_on: [dnsd, otel-collector]

  intake_collector:
    <<: *rust-build
    image: fleetingdns/intake_collector:dev
    command: ["/app/intake_collector-bin"]
    depends_on: [otel-collector]

  ml_scorer:
    <<: *rust-build
    image: fleetingdns/ml_scorer:dev
    command: ["/app/ml_scorer-bin"]
    depends_on: [otel-collector]

  feed_grpc:
    <<: *rust-build
    image: fleetingdns/feed_grpc:dev
    command: ["/app/feed_grpc-bin"]
    depends_on: [otel-collector]

  feed_webhook:
    <<: *rust-build
    image: fleetingdns/feed_webhook:dev
    command: ["/app/feed_webhook-bin"]
    depends_on: [otel-collector]

  api:
    <<: *rust-build
    image: fleetingdns/api:dev
    command: ["/app/apictl"]
    depends_on: [postgres, redis, otel-collector]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: fdns
      POSTGRES_PASSWORD: fdns
      POSTGRES_DB: fdns
    volumes: ["pgdata:/var/lib/postgresql/data"]

  mimir:
    image: grafana/mimir:2.10.2
    command: ["-config.file=/etc/mimir.yaml"]
    volumes: ["./mimir-local.yaml:/etc/mimir.yaml:ro"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.93.0
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--enable-feature=memory-snapshot-on-shutdown"
    ports: ["9090:9090"]

  loki:
    image: grafana/loki:2.9.3
    command: ["-config.file=/etc/loki-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki-config.yaml:ro
    ports: ["3100:3100"]

  promtail:
    image: grafana/promtail:2.9.3
    command: ["-config.file=/etc/promtail-config.yaml"]
    volumes:
      - ./promtail-config.yaml:/etc/promtail-config.yaml:ro
      - /var/log:/var/log:ro

  grafana:
    image: grafana/grafana:10.3.1
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SERVER_HTTP_PORT=3000
    ports: ["3000:3000"]
    depends_on: [prometheus, loki, mimir]

volumes:
  pgdata:

networks:
  default:
    driver: bridge
