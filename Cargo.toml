[workspace]
resolver = "2"
members = [
    "crates/*",
    "crates/bin/*",
    "cmd/*"
]
exclude = [
    "crates/bin"
]

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
metrics = "0.21"
metrics-exporter-prometheus = "0.12"
tokio = { version = "1", features = ["full"] }
