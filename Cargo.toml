[workspace]
resolver = "2"
members = [
    "crates/*",
    "crates/bin/slot-setter",
    "cmd/*"
]
exclude = [
    "crates/bin"
]

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
metrics = "0.21"
metrics-exporter-prometheus = "0.12"
tokio = { version = "1", features = ["full"] }
bb8 = "0.9"
redis = { version = "0.32", default-features = false, features = ["tokio-comp"] }
parking_lot = "0.12.1"
asm = { version = "0.11", features = ["std"] }llvm_assembly = { version = "0.11", features = ["std"] }
rustls = "0.23"
tokio-rustls = "0.26"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
rustls-pemfile = "1"
