[workspace]
resolver = "2"
members = [
    "crates/auth",
    # "crates/backendapi",    # Temporarily disabled due to API integration issues
    "crates/bin/dnsd",
    "crates/bin/slot-setter",
    "crates/common",
    "crates/dnsd",
    "crates/dnsd_backend",
    "crates/edf-ca",
    "crates/edgehub",
    "crates/feature_pipe",
    "crates/feed_grpc",
    "crates/feed_webhook",
    "crates/intake_collector",
    "crates/metrics_client",
    "crates/ml_scorer",
    # "cmd/api-bin",           # Temporarily disabled due to API integration issues
    "cmd/dnsd-bin",
    "cmd/edgehub-bin",
    "cmd/feed_grpc-bin",
    "cmd/feed_webhook-bin",
    "cmd/fleetingdns-ctl",
    "cmd/intake_collector-bin",
    "cmd/ml_scorer-bin",
]
exclude = [
    "crates/bin"
]

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
metrics = "0.24"
metrics-exporter-prometheus = "0.12"
metrics-exporter-opentelemetry = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
bb8 = "0.9"
redis = { version = "0.32", default-features = false, features = ["tokio-comp"] }
rustls = "0.23"
tokio-rustls = "0.26"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
rustls-pemfile = "1"
testcontainers = "0.16"
testcontainers-modules = { version = "0.4", features = ["redis"] }
# Additional dependencies for API
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
bb8-redis = "0.16"
config = "0.14"
base64 = "0.22"
md5 = "0.7"

