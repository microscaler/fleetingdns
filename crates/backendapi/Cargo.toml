[package]
name = "backendapi"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = "1.0"

# HTTP client for GitHub OAuth
reqwest = { version = "0.12", features = ["json"] }

# Error handling
anyhow = "1.0"
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Certificate authority integration
edf-ca = { path = "../edf-ca" }

# Common utilities
common = { path = "../common" }

# Redis for tunnel metadata storage - use compatible versions
redis = { workspace = true }
bb8 = "0.8"
bb8-redis = "0.15"

# Configuration
config = "0.14"

# Base64 encoding for certificates
base64 = "0.22"

# Additional dependencies
md5 = "0.7"
rand = { workspace = true }

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
