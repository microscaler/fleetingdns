[package]
name = "backendapi"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = "1.0"

# HTTP client for GitHub OAuth
reqwest = { version = "0.12", features = ["json"] }

# Error handling
anyhow = "1.0"
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Certificate authority integration
edf-ca = { path = "../edf-ca" }

# Authentication
auth = { path = "../auth" }

# Common utilities
common = { path = "../common" }

# Redis for tunnel metadata storage - use compatible versions
redis = { workspace = true }
bb8 = { workspace = true }
bb8-redis = { workspace = true }

# Configuration
config = "0.14"

# Base64 encoding for certificates
base64 = "0.22"

# Additional dependencies
md5 = "0.7"
rand = { workspace = true }

# Rate limiting dependencies
governor = "0.6"
dashmap = "5.5"
nonzero_ext = "0.3"

sea-orm = { version = "1.1.13", features = ["sqlx-postgres", "runtime-tokio-native-tls"] }
models = { path = "../models" }

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
sea-orm-migration = "1.1.13"
migration = { path = "../migration" }
jsonwebtoken = "9.2"

[lints]
workspace = true
