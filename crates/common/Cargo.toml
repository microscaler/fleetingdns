[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
metrics = { workspace = true }
metrics-exporter-opentelemetry = { workspace = true }
opentelemetry = { version = "0.30", default-features = false, features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.30", default-features = false, features = ["metrics", "trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.30", features = ["grpc-tonic", "metrics", "trace"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.0"
rcgen = "0.14"
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
libc = "0.2"
redis = { workspace = true }
bb8 = "0.9"
bb8-redis = "0.20"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"
russh = "0.60"
# rand 0.10 alias for russh/ssh-key PrivateKey::random (rand_core 0.10 CryptoRng);
# workspace rand stays 0.8 for everything else. Used by ssh_keys::generate_*.
rand_key = { package = "rand", version = "0.10", features = ["thread_rng"] }
# Certificate management dependencies.
# NOTE: acme2 removed 2026-07 — it was never imported (only referenced in a
# cert_manager.rs comment) yet pinned ancient reqwest 0.11 / hyper 0.14 /
# rustls 0.21, dragging in rustls-webpki 0.101.7 (RUSTSEC-2026-0098/99/0104).
# When ACME automation is implemented, use a maintained client (e.g.
# instant-acme) that builds on the workspace rustls 0.23.
ring = "0.17"
x509-parser = "0.16"
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true }
hex = "0.4"
# HIGH-5 ENHANCEMENT: DDoS protection dependencies
dashmap = "5.5"

[dev-dependencies]
tracing-test = "0.2"
tokio = { workspace = true, features = ["full"] }
tonic = { version = "0.13", features = ["transport"] }
tokio-stream = "0.1"
opentelemetry-proto = { version = "0.30", features = ["gen-tonic", "metrics"] }
tempfile = "3.0"
ctor = "0.2"

[lints]
workspace = true
