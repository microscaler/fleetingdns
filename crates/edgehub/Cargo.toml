[package]
name = "edgehub"
version = "0.1.0"
edition = "2024"

[features]
e2e = []

[dependencies]
common = { path = "../common" }
dnsd = { path = "../dnsd" }
edf-ca = { path = "../edf-ca" }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
metrics = { workspace = true }
anyhow = { workspace = true }
russh = "0.40"
russh-keys = "0.40"
uuid = { workspace = true }
rand = "0.8"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2.0"
ring = "0.17"
hex = "0.4"
redis = { workspace = true }
async-trait = "0.1"
# CRITICAL-3 ENHANCEMENT: Additional dependencies for certificate validation
x509-parser = "0.16"
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
base64 = "0.21"

[dev-dependencies]
tracing-test = "0.2"
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
hickory-resolver = "0.24"
mini-redis = "0.4"
tracing-subscriber = "0.3"
sea-orm = { version = "1.1.13", features = ["sqlx-postgres", "runtime-tokio-native-tls"] }
sea-orm-migration = "1.1.13"
migration = { path = "../migration" }
uuid = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
serde_json = "1.0"
