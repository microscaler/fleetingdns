[package]
name = "migration"
version = "0.1.0"
edition = "2024"

[dependencies]
sea-orm-migration = { version = "1.1.13", features = ["sqlx-postgres"] }
sea-orm = { version = "1.1.13", features = ["sqlx-postgres", "runtime-tokio-native-tls"] }
async-trait = "0.1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-native-tls"] }
# Runtime for the `migration` binary (CI/hook migration runner in src/main.rs).
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }

# The library is the canonical Migrator; the binary is a thin CLI runner used by
# CI and the chart's pre-install migration hook.
[lib]
name = "migration"
path = "src/lib.rs"

[[bin]]
name = "migration"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1.0"
serial_test = "2.0"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
testcontainers = { workspace = true, features = ["blocking"] }
testcontainers-modules = { workspace = true }
tokio-postgres = "0.7"

# If a rust-toolchain.toml is needed for nightly, create it in this directory. 

[lints]
workspace = true
