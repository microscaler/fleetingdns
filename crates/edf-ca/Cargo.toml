[package]
name = "edf-ca"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde"] }
metrics = { workspace = true }

# Cryptography and certificates
rustls = "0.23"
rustls-pemfile = "1.0"
x509-parser = "0.16"
ring = "0.17"
rcgen = "0.12"

# Common utilities
common = { path = "../common" }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0" 

[lints]
workspace = true
