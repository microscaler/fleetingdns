[package]
name = "auth"
version = "0.1.0"
edition = "2024"

[dependencies]
# HTTP client for GitHub OAuth
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0.12"

# Logging
tracing = "0.1"

# HTTP headers
axum = { version = "0.8", features = ["macros"] }

# Hashing for JWT signatures
md5 = "0.7"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Common utilities
common = { path = "../common" }

[lints]
workspace = true
