[package]
name = "dnsd"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
metrics = { workspace = true }
hickory-proto = { version = "0.26", features = ["dnssec-ring"] }
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
thiserror = { workspace = true }
bb8 = "0.9"
bb8-redis = "0.20"
redis = { workspace = true }
ring = "0.17"
# HIGH-1 ENHANCEMENT: Performance and security dependencies
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio-util = { version = "0.7", features = ["time"] }
governor = "0.6"
nonzero_ext = "0.3"
arc-swap = "1.7"
# HIGH-3 ENHANCEMENT: Production DNSSEC dependencies
hex = "0.4"
rand = { workspace = true }
# MEDIUM-2 ENHANCEMENT: Performance optimization dependencies
once_cell = "1.19"
ttl_cache_with_purging = "0.2.0"
zstd = "0.13"

[dev-dependencies]
tracing-test = "0.2"
mini-redis = "0.4"
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tempfile = "3.0"
serial_test = "2.0"
# Redis integration testing
redis = { workspace = true } # For direct Redis client in tests

[features]
dot = ["tokio-rustls", "rustls"]

[lints]
workspace = true
