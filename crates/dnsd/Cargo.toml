[package]
name = "dnsd"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
hickory-proto = { version = "0.24", features = ["dnssec", "dnssec-ring"] }
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", optional = true }
bb8 = { workspace = true }
bb8-redis = "0.24"
redis = { workspace = true }
thiserror = { workspace = true }
ring = "0.17"
# HIGH-1 ENHANCEMENT: Performance and security dependencies
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
tokio-util = { version = "0.7", features = ["time"] }
governor = "0.6"
nonzero_ext = "0.3"
arc-swap = "1.7"

[features]
dot = ["tokio-rustls", "rustls"]

[dev-dependencies]
tracing-test = "0.2"
mini-redis = "0.4"
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tempfile = "3.0"
