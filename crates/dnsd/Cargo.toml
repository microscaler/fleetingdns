[package]
name = "dnsd"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
hickory-proto = "0.24"
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", optional = true }

[features]
dot = ["tokio-rustls", "rustls"]

[dev-dependencies]
tracing-test = "0.2"
